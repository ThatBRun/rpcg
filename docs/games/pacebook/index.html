<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PaceBook">
<meta name="theme-color" content="#060a14">
<link rel="apple-touch-icon" href="../../icons/pacebook.png">
<link rel="icon" href="../../icons/pacebook.png">
<title>PaceBook — Play-Money Sportsbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a14;--pan:#0d1426;--pan2:#131c33;--pan3:#1a2541;--line:#202c4b;--txt:#e8eeff;--mut:#8592b8;--acc:#2f8cff;--acc2:#6fb2ff;--win:#22c55e;--loss:#f05252;--gold:#fbbf24;--live:#ff3b3b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.cond{font-family:'Barlow Condensed',Inter,sans-serif}
header.top{position:sticky;top:0;z-index:30;height:calc(58px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top) !important;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(6,10,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:1.5px;cursor:pointer;white-space:nowrap}
.logo svg{width:28px;height:28px;flex:none}
.logo span{color:var(--acc2)}
.logo small{font-family:Inter;font-weight:600;font-size:10px;letter-spacing:.4px;color:var(--mut);align-self:flex-end;margin-bottom:8px}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.speed{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;white-space:nowrap}
select{background:var(--pan2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
.wallet{display:flex;align-items:center;gap:8px;background:var(--pan2);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#fbbf24 45%,#b7791f);box-shadow:0 0 8px rgba(251,191,36,.5);display:inline-block;flex:none;vertical-align:-2px}
.btn{background:var(--acc);border:0;border-radius:10px;padding:9px 14px;font-weight:700;color:#fff}
.btn:hover{filter:brightness(1.12)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:var(--pan2);border:1px solid var(--line);color:var(--txt)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;min-height:calc(100vh - 58px);align-content:start}
nav.side{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nh{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:12px 10px 6px;font-weight:700}
.ni{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:9px;text-align:left;font-weight:600;white-space:nowrap}
.ni:hover{background:var(--pan2)}
.ni.on{background:var(--pan3);box-shadow:inset 3px 0 0 var(--acc)}
.ni .ic{width:22px;text-align:center}
.ni .bd{margin-left:auto;font-size:11px;background:rgba(255,59,59,.15);color:#ff8080;padding:1px 7px;border-radius:999px;font-weight:700}
.ni .bd.b{background:rgba(47,140,255,.18);color:var(--acc2)}
.disc{font-size:11px;color:var(--mut);padding:16px 10px;line-height:1.55}
main{padding:18px 22px 90px;min-width:0}
h1,h2,h3{margin:0}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{font-family:'Barlow Condensed';font-size:24px;letter-spacing:.5px;text-transform:uppercase}
.sec .ct{color:var(--mut);font-weight:600}
.sub{display:flex;align-items:center;gap:8px;margin:16px 0 8px;color:var(--mut);font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:12px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 26px 24px;background:radial-gradient(ellipse at 85% -20%,rgba(47,140,255,.55),transparent 60%),radial-gradient(ellipse at 10% 120%,rgba(255,59,59,.35),transparent 55%),linear-gradient(135deg,#0f1a36,#0a1022);border:1px solid var(--line)}
.hero h1{font-family:'Barlow Condensed';font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.5px;max-width:560px}
.hero p{color:#b9c5e8;max-width:560px;margin:10px 0 16px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .lights{position:absolute;right:-30px;top:-30px;width:260px;height:260px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.07),transparent 30%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gcard{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;cursor:pointer;transition:border-color .15s}
.gcard:hover{border-color:#2d3d66}
.gcard.live{border-color:rgba(255,59,59,.28)}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12px}
.lg{color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut)}
.clk.live{color:#ff8080}
.clk.final{color:var(--txt)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.2s infinite;vertical-align:1px}
@keyframes pulse{50%{opacity:.25}}
.gr{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),78px);gap:6px;align-items:center;margin-top:5px}
.ch{font-size:11px;color:var(--mut);text-align:center;font-weight:600}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.sw{width:10px;height:22px;border-radius:3px;flex:none}
.tn{font-weight:600;font-size:13.5px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tn .sn{display:none}
.tn.mut{color:var(--mut);padding-left:18px}
.ts{margin-left:auto;font-family:'Barlow Condensed';font-size:22px;font-variant-numeric:tabular-nums;padding-right:4px}
.ts small{font-size:14px;color:var(--mut);margin-left:4px}
.ob{background:var(--pan2);border:1px solid var(--line);border-radius:9px;padding:5px 4px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .12s,border-color .12s;min-width:0}
.ob:hover{border-color:var(--acc);background:#16264a}
.ob .nm{font-size:11.5px;color:#c9d3f0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px}
.ob .ln{font-size:11.5px;color:var(--mut);font-weight:600}
.ob .od{font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}
.ob.on{background:var(--acc);border-color:var(--acc)}
.ob.on .od,.ob.on .ln,.ob.on .nm{color:#fff}
.ob.lock{opacity:.45;cursor:default}
.ob.lock:hover{border-color:var(--line);background:var(--pan2)}
.ob.done .od{color:var(--win)}
.ob.up{animation:up 1s}
.ob.dn{animation:dn 1s}
@keyframes up{0%{box-shadow:0 0 0 2px var(--win)}100%{box-shadow:none}}
@keyframes dn{0%{box-shadow:0 0 0 2px var(--loss)}100%{box-shadow:none}}
.gf{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.lnk{background:none;border:0;color:var(--acc2);font-weight:600;font-size:12.5px;padding:2px 0}
.watch{background:linear-gradient(90deg,#ff3b3b,#ff7a3b);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px}
.empty{color:var(--mut);padding:30px 10px;text-align:center}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.real{background:rgba(34,197,94,.18);color:#4ade80}
.tag.sim{background:rgba(133,146,184,.18);color:#a9b4d6}
.tv{font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.info{margin-top:14px;background:rgba(47,140,255,.08);border:1px solid rgba(47,140,255,.3);border-radius:14px;padding:12px 14px;color:#c6d3f5;font-size:13px;line-height:1.5}
.note{font-size:12px;color:var(--mut);margin-top:12px}
/* game detail */
.crumb{background:none;border:0;color:var(--acc2);font-weight:600;padding:0;margin-bottom:12px}
.gd{background:linear-gradient(180deg,#111b35,#0c1328);border:1px solid var(--line);border-radius:18px;padding:18px}
.gdTop{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:12.5px;font-weight:600}
.gdScore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:14px 0}
.gdT{display:flex;align-items:center;gap:12px}
.gdT.r{flex-direction:row-reverse;text-align:right}
.badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);flex:none}
.gdT b{display:block;font-size:17px}
.gdT small{color:var(--mut)}
.gdS{font-family:'Barlow Condensed';font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.gdS .c{display:block;font-size:15px;color:#ff8080;font-weight:700;letter-spacing:.5px}
.gdS .c.pre,.gdS .c.final{color:var(--mut)}
.wp{margin:6px 0 4px}
.wpb{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--pan2)}
.wpb i{display:block;height:100%;transition:width .6s}
.wpl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:600}
table.ls{border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums;font-size:13px}
table.ls th,table.ls td{padding:4px 9px;text-align:center}
table.ls th{color:var(--mut);font-weight:600;font-size:11.5px}
table.ls td:first-child,table.ls th:first-child{text-align:left;font-weight:700}
table.ls td.t{font-weight:800;color:#fff}
.lsw{overflow-x:auto}
.bigWatch{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,#ff3b3b,#ff7a3b 50%,#ffb03b);box-shadow:0 8px 30px rgba(255,80,60,.25);letter-spacing:.3px}
.mk{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.mkh{font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between}
.mkh small{color:var(--mut);font-weight:600}
.mkg{display:grid;gap:7px}
.mkg.c2{grid-template-columns:1fr 1fr}
.mkg.c3{grid-template-columns:1fr 1fr 1fr}
.mkg.c4{grid-template-columns:repeat(4,1fr)}
.pou{display:grid;grid-template-columns:1fr 92px 92px;gap:7px;align-items:center}
.pou .pn{font-weight:600}
.pou .pn small{color:var(--mut);margin-left:6px}
.feed{display:flex;flex-direction:column;gap:2px}
.fi{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.fi .fc{color:var(--mut);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.fi.big .fx{font-weight:700}
.fi .fx i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* bets */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.stat b{display:block;font-family:'Barlow Condensed';font-size:28px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:16px 0 10px}
.tab{background:var(--pan2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bet{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bet.won{border-color:rgba(34,197,94,.45)}
.bet.lost{opacity:.75}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bh b{font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.chip.open{background:rgba(47,140,255,.18);color:var(--acc2)}
.chip.won{background:rgba(34,197,94,.18);color:#4ade80}
.chip.lost{background:rgba(240,82,82,.16);color:#ff8a8a}
.chip.cashed{background:rgba(251,191,36,.16);color:var(--gold)}
.chip.push{background:var(--pan3);color:var(--mut)}
.leg{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);align-items:start}
.leg:first-of-type{border-top:0}
.leg .li{font-weight:800;text-align:center}
.leg .li.w{color:var(--win)}.leg .li.l{color:var(--loss)}.leg .li.p{color:var(--mut)}
.leg .lt b{display:block}
.leg .lt small{color:var(--mut)}
.leg .lo{font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}
.bf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;gap:10px;flex-wrap:wrap}
.bf span{color:var(--mut)}
.bf b{color:var(--txt);font-variant-numeric:tabular-nums}
.cash{background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#1b1300;border:0;border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px}
/* slip */
aside.slip{border-left:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);display:flex;flex-direction:column;background:var(--pan);z-index:60}
.sH{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-family:'Barlow Condensed';font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.sH .n{background:var(--acc);color:#fff;font-family:Inter;font-size:12px;border-radius:999px;padding:1px 8px}
.sH .x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:22px;display:none}
.sH .clr{margin-left:auto;background:none;border:0;color:var(--mut);font-family:Inter;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.sTabs{display:flex;gap:6px;padding:0 14px 10px}
.sTabs .tab{flex:1}
.sB{flex:1;overflow:auto;padding:0 14px}
.si{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.si .r1{display:flex;gap:8px;align-items:flex-start}
.si .r1 b{flex:1;font-size:13.5px}
.si .sx{background:none;border:0;color:var(--mut);font-size:16px;line-height:1;padding:0 2px}
.si .r2{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:3px;gap:8px}
.si .so{font-weight:800;color:var(--acc2);white-space:nowrap}
.si .so.ch{color:var(--gold)}
.si .so.sus{color:var(--loss)}
.stk{display:flex;gap:6px;margin-top:8px;align-items:center}
.stk input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--txt);font-weight:700}
.stk input:focus{outline:none;border-color:var(--acc)}
.qs{background:var(--pan3);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:11.5px;font-weight:700;color:var(--mut)}
.qs:hover{color:var(--txt)}
.tw{font-size:12px;color:var(--mut);margin-top:6px;text-align:right}
.tw b{color:var(--win)}
.sF{border-top:1px solid var(--line);padding:12px 14px 14px;background:var(--pan)}
.sF .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--mut)}
.sF .row b{color:var(--txt);font-variant-numeric:tabular-nums}
.sF .row b.g{color:var(--win)}
.sF label{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--mut);margin:8px 0 10px}
.sF .btn{width:100%;padding:12px;font-size:15px}
.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);color:var(--gold);font-size:12px;border-radius:9px;padding:7px 9px;margin-bottom:8px}
.slipFab{display:none;position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:55;background:var(--acc);color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.5);gap:8px;align-items:center}
.slipFab b{background:#fff;color:var(--acc);border-radius:999px;padding:0 7px;font-size:12px}
/* toasts */
#toasts{position:fixed;left:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#18223e;border:1px solid var(--line);border-left:4px solid var(--acc);padding:10px 14px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:600;max-width:340px;animation:tin .25s;transition:opacity .4s,transform .4s}
.toast.ok{border-left-color:var(--win)}
.toast.bad{border-left-color:var(--loss)}
.toast.warn{border-left-color:var(--gold)}
.toast.out{opacity:0;transform:translateX(-20px)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
/* arena */
#arena{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(ellipse at 15% -10%,rgba(47,140,255,.28),transparent 45%),radial-gradient(ellipse at 85% -10%,rgba(255,70,70,.22),transparent 45%),#02040a;overflow:auto}
body.arena-on #arena{display:flex}
body.arena-on{overflow:hidden}
.abar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.abar .t{font-family:'Barlow Condensed';font-size:20px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#cfd8f7}
.abar .t i{color:#ff6b6b;font-style:normal}
.abar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jumbo{margin:0 14px;border-radius:16px;background:linear-gradient(180deg,#0b0f1c,#05070d);border:1px solid #1d2742;box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 20px 60px rgba(0,0,0,.6);display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:14px;padding:12px 18px;position:relative;overflow:hidden}
.jumbo:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px);pointer-events:none}
.jt{display:flex;align-items:center;gap:12px;min-width:0}
.jt.r{flex-direction:row-reverse;text-align:right}
.jt .badge{width:54px;height:54px;font-size:20px;box-shadow:0 0 24px var(--c)}
.jt b{font-family:'Barlow Condensed';font-size:22px;letter-spacing:.5px;text-transform:uppercase;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jt small{color:#8592b8;font-weight:600}
.jsc{font-family:'Barlow Condensed';font-size:66px;font-weight:800;line-height:1;color:#ffd84d;text-shadow:0 0 18px rgba(255,200,40,.55);font-variant-numeric:tabular-nums;min-width:60px;text-align:center}
.jmid{text-align:center;min-width:170px}
.jclk{font-family:'Barlow Condensed';font-size:26px;font-weight:800;color:#ff5a5a;text-shadow:0 0 12px rgba(255,60,60,.6);font-variant-numeric:tabular-nums;white-space:nowrap}
.jmid .wpb{margin-top:6px;height:6px}
.jmid .wpl{font-size:11px}
.ribbon{margin:10px 14px 0;height:30px;border-radius:8px;background:#05070d;border:1px solid #1d2742;overflow:hidden;position:relative}

/* ================= simulation core ================= */
function initState(sp){

 if(sp==='tennis'||sp==='volleyball'){s.cur=[0,0];s.srv=rnd()<.5?0:1;s.tg=0}

function clone(s){const c=Object.assign({},s);c.score=s.score.slice();c.ps=s.ps.map(x=>x.slice());c.ev=s.ev.slice();c.st=s.st.map(x=>x.slice());if(s.cur)c.cur=s.cur.slice();return c}
function ensureP(s,pi){while(s.ps.length<=pi)s.ps.push([0,0])}
function sc(s,t,pts,pl,statAdd){s.score[t]+=pts;s.ps[s.ps.length-1][t]+=pts;s.ev.push(t);if(pl>=0)s.st[t][pl]+=statAdd}
function finish(s){s.over=true;if(s.win<0)s.win=s.score[0]>s.score[1]?0:s.score[1]>s.score[0]?1:2}
function rel(P,i){const home=P.indiv?0:(i===1?3:-3);return (P.tf||1)*Math.exp((P.r[i]-P.r[1-i]+home)*P.k)}
function wshare(P,i){const a=rel(P,0),b=rel(P,1);return i===0?a/(a+b):b/(a+b)}

const PN=(P,t,i)=>i>=0?P.pl[t][i]:'A role player';

function hoops(s,P,L){
 const C=SP[s.sp],reg=C.reg,pl=C.plen;
 ensureP(s,s.u<reg?Math.floor(s.u/pl):C.np+Math.floor((s.u-reg)/5));
 for(let k=0;k<2;k++)for(const t of [0,1]){
  const m=rel(P,t)*C.eff,r=rnd();let pts=0;
  if(r<.125*m)pts=3;else if(r<.495*m)pts=2;else if(r<.55*m)pts=rnd()<.7?2:1;
  if(pts){const pl=pickPl(P.sh);sc(s,t,pts,pl,pts);
   if(L&&pts===3&&rnd()<.6)L(`${PN(P,t,pl)} drains a three for ${P.tn[t]}`,'score',t,'THREE!');
   else if(L&&pts===2&&rnd()<.08)L(`${PN(P,t,pl)} throws down a monster dunk!`,'score',t,'SLAM DUNK!');}
 }
 s.u++;
 if(L&&s.u<reg&&s.u%pl===0){if(s.u===reg/2)L('Halftime','info');else L(`End of the ${ord(s.u/pl)} ${C.pword}`,'info')}
 if(s.u>=reg&&(s.u-reg)%5===0){
  if(s.score[0]!==s.score[1])finish(s);
  else if(s.u>=reg+25){const t=rnd()<wshare(P,1)?1:0;sc(s,t,1,-1,0);finish(s)}
  else{s.ot=true;L&&L('All tied up — OVERTIME!','big',-1,'OVERTIME')}
 }
}
const STEP={

   else if(r<.068*m){sc(s,t,3,-1,0);L&&L(`Field goal is good — ${P.tn[t]} +3`,'score',t,'FIELD GOAL');}
   if(s.ot&&s.score[0]!==s.score[1]){s.u++;finish(s);L&&L(`${P.tn[s.win]} win it in overtime!`,'big',s.win,'WALK-OFF!');return}
  }
  s.u++;
  if(L&&(s.u===15||s.u===45))L(`End of the ${s.u===15?'1st':'3rd'} quarter`,'info');

  else if(s.u>=70&&!s.over){const t=rnd()<wshare(P,1)?1:0;sc(s,t,3,-1,0);finish(s);L&&L(`Last-second field goal! ${P.tn[t]} win`,'big',t,'GAME OVER')}

  const target=s.ps.length===4?15:25,sv=s.srv;

  const w=rnd()<p1?1:0;s.cur[w]++;s.tg++;s.srv=w;s.u++;
  if(s.cur[w]>=target&&s.cur[w]-s.cur[1-w]>=2){const a=s.cur[w],b=s.cur[1-w];s.ps.push(s.cur.slice());s.score[w]++;s.ev.push(w);
   L&&L(`${P.tn[w]} take set ${s.ps.length}, ${a}-${b}`,'big',w,'SET '+String(P.tn[w]).toUpperCase());s.cur=[0,0];

    else L(`${P.tn[bat]} push across ${runs} run${runs>1?'s':''}`,'score',bat,runs>1?runs+' RUNS SCORE':'RUN SCORES');}

  if(s.cur[0]===6&&s.cur[1]===6){w=rnd()<clamp(.5+(P.r[0]-P.r[1])*.006,.2,.8)?0:1;s.cur[w]=7;s.tg++;L&&L(`${P.tn[w]} takes the tiebreak`,'score',w,'TIEBREAK')}

   if(s.score[w]===2){finish(s);L&&L(`Game, set, match — ${P.tn[w]}!`,'big',w,'MATCH!')}}

   L&&L(sub?`${P.tn[w]} locks in a choke — the tap! Submission win!`:`${P.tn[w]} lands a huge shot — it's stopped! KO/TKO!`,'big',w,sub?'SUBMISSION!':'KNOCKOUT!');return}

function simulate(g,N){const P=params(g),f=STEP[g.sport],out=new Array(N);for(let n=0;n<N;n++){const c=clone(g.s);let k=0;while(!c.over&&k++<400)f(c,P,null);out[n]=c}return out}

/* ================= grading & pricing ================= */
function ou(v,q,over){if(q.k==='o'&&v>q.l)return 1;if(q.k==='u'&&v>q.l)return 0;if(!over)return null;return q.k==='o'?0:1}
function grade(s,q){
 switch(q.m){
  case 'ml':if(!s.over)return null;if(s.win===2&&!SP[s.sp].draw)return 2;return s.win===q.k?1:0;
  case 'sp':{if(!s.over)return null;const mg=s.score[1]-s.score[0];return q.k===1?(mg>q.l?1:0):(mg<q.l?1:0)}
  case 'tot':return ou(s.score[0]+s.score[1],q,s.over);
  case 'tt':return ou(s.score[q.t],q,s.over);
  case 'tg':return ou(s.tg,q,s.over);
  case 'ts':return ou(s.score[0]+s.score[1],q,s.over);
  case 'pou':return ou(s.st[q.t][q.i],q,s.over);
  case 'p1':{if(!p1Done(s))return null;const a=s.ps[0]||[0,0];const r=a[0]>a[1]?0:a[1]>a[0]?1:2;return r===q.k?1:0}
  case 'nx':if(s.ev.length>q.n)return s.ev[q.n]===q.k?1:0;if(s.over)return q.k===-1?1:0;return null;
  case 'any':if(s.st[q.t][q.i]>=q.l)return 1;return s.over?0:null;
  case 'sb':return s.over?(s.score[0]+'-'+s.score[1]===q.k?1:0):null;
  case 'meth':return s.over?(s.win===q.t&&s.method===q.k?1:0):null;
  case 'dist':return s.over?((s.method==='DEC')===(q.k==='y')?1:0):null;
  case 'ot':if(s.ot)return q.k==='y'?1:0;if(s.over)return q.k==='y'?0:1;return null;
  case 'btts':{const y=s.score[0]>0&&s.score[1]>0;if(y)return q.k==='y'?1:0;if(s.over)return q.k==='y'?0:1;return null}
 }
 return null;
}
const qkey=(gid,q)=>[gid,q.m,q.k,q.l,q.t,q.i,q.n].map(x=>x==null?'':x).join('|');
function prob(g,q){const S=g.sims;if(!S||!S.length)return null;let w=0;for(const c of S)if(grade(c,q)===1)w++;return w/S.length}
function toAm(p){if(p==null||p<.012||p>.975)return null;const imp=Math.min(.985,p*1.045+.004),d=1/imp,rd=v=>{const s=v>=1000?50:v>=400?25:5;return Math.round(v/s)*s};
 if(d>=2)return Math.min(10000,rd((d-1)*100));let a=-rd(100/(d-1));return a>-100?-100:a}
const dec=a=>a>0?1+a/100:1+100/(-a);
const fmtAm=a=>a==null?'—':(a>0?'+'+a:''+a);
function price(g,q){const key=qkey(g.id,q);if(grade(g.s,q)!==null)return{key,am:null,done:grade(g.s,q)===1};
 let p=prob(g,q);if(p==null)return{key,am:null};
 if(g._pcEv!==g.s.ev.length){g._pc={};g._pcEv=g.s.ev.length}
 const c=g._pc;if(c[key]!=null)p=.5*c[key]+.5*p;c[key]=p;return{key,am:toAm(p),p}}
const sig=g=>g.s.ev.length+'|'+(g.s.ot?1:0)+'|'+(g.s.over?1:0)+'|'+(p1Done(g.s)?1:0);
const stale=g=>isLive(g)&&g._simSig!==sig(g);

/* ================= markets ================= */
const SELS={};
function markets(g){
 const s=g.s,sp=g.sport,C=SP[sp],S=g.sims;if(!S||s.over)return[];
 const live=isLive(g),T=g.t,nm=i=>T[i].name,ab=i=>T[i].ab,M=[];
 const meds=f=>median(S.map(f));
 const add=(id,name,outs,type)=>{const o=outs.map(x=>{const pr=price(g,x.q);const r=Object.assign(x,{key:pr.key,am:pr.am,done:pr.done,gid:g.id,mname:name,pk:x.pk||x.name+(x.line&&x.line!==x.name?' '+x.line:'')});SELS[r.key]=r;return r});M.push({id,name,outs:o,type})};
 if(C.draw)add('ml','Match Result',[{q:{m:'ml',k:0},name:nm(0),line:''},{q:{m:'ml',k:2},name:'Draw',line:''},{q:{m:'ml',k:1},name:nm(1),line:''}]);
 else add('ml',C.indiv?'To Win':'Moneyline',[{q:{m:'ml',k:0},name:nm(0),line:''},{q:{m:'ml',k:1},name:nm(1),line:''}]);
 if(!C.indiv&&!C.sets){
  const mg=S.reduce((a,c)=>a+c.score[1]-c.score[0],0)/S.length;
  const L=(sp==='hockey'||sp==='baseball')?(mg>=0?1.5:-1.5):half(mg);
  add('sp',C.spn,[{q:{m:'sp',k:0,l:L},name:nm(0),line:fl(L)},{q:{m:'sp',k:1,l:L},name:nm(1),line:fl(-L)}]);
  const TL=half(meds(c=>c.score[0]+c.score[1]));
  add('tot','Total '+C.unit,[{q:{m:'tot',k:'o',l:TL},name:'Over',line:'O '+TL,pk:'Over '+TL},{q:{m:'tot',k:'u',l:TL},name:'Under',line:'U '+TL,pk:'Under '+TL}]);
  if(live&&!g.real)add('nx','Next to Score',[{q:{m:'nx',k:0,n:s.ev.length},name:nm(0),line:'Next',pk:nm(0)+' score next'},{q:{m:'nx',k:-1,n:s.ev.length},name:'No more scoring',line:'None',pk:'No more scoring'},{q:{m:'nx',k:1,n:s.ev.length},name:nm(1),line:'Next',pk:nm(1)+' score next'}]);
  if(!p1Done(s))add('p1',C.p1+' Result',[{q:{m:'p1',k:0},name:nm(0),line:ab(0)},{q:{m:'p1',k:2},name:'Tie',line:'Tie',pk:C.p1+' tie'},{q:{m:'p1',k:1},name:nm(1),line:ab(1)}]);
  const tt=[];for(const i of[0,1]){const l=half(meds(c=>c.score[i]));tt.push({q:{m:'tt',t:i,k:'o',l},name:ab(i)+' Over',line:'O '+l,pk:`${nm(i)} Over ${l}`},{q:{m:'tt',t:i,k:'u',l},name:ab(i)+' Under',line:'U '+l,pk:`${nm(i)} Under ${l}`})}
  add('tt','Team Totals',tt);
  if(sp==='soccer')add('btts','Both Teams to Score',[{q:{m:'btts',k:'y'},name:'Yes',line:'',pk:'Both teams score: Yes'},{q:{m:'btts',k:'n'},name:'No',line:'',pk:'Both teams score: No'}]);

/* ================= sims scheduler ================= */
function needSims(g){

}
function refreshSims(budget){
 const t0=performance.now(),cand=[];
 for(const g of V.games){
  if(g.s.over){if(g.sims||g._mk){g.sims=null;g._mk=[]}continue}
  const live=isLive(g),keep=needSims(g);let pri=-1;
  if(!g._simAt)pri=3;else if(keep&&!g.sims)pri=4;else if(live&&g._simSig!==sig(g))pri=5;else if(live&&!g._wasLive)pri=4;
  else if(live&&t0-g._simAt>2500&&g._simU!==g.s.u)pri=2;else if(!live&&t0-g._simAt>(keep?30000:300000))pri=1;
  if(!keep&&g.sims&&pri<0){g.sims=null}
  if(pri>=0)cand.push([pri,g._simAt||0,g]);
 }
 cand.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
 for(const [,,g] of cand){if(performance.now()-t0>budget)break;const live=isLive(g),keep=needSims(g);
  g.sims=simulate(g,live?350:keep?450:260);g._simAt=performance.now();g._simSig=sig(g);g._simU=g.s.u;g._wasLive=live;g._mk=markets(g);if(!keep)g.sims=null}
}

function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}

}

 const st=status(g),C=SP[g.sport],lock=stale(g),T=g.t;
 const team=(i,r)=>`<div class="gdT${r?' r':''}"><div class="badge" style="background:${T[i].c}">${esc(T[i].ab)}</div><div><b>${esc(T[i].name)}</b><small>${C.indiv?'':(i===1?'Home':'Away')}${g.real&&T[i].rec?' · '+esc(T[i].rec):''}</small></div></div>`;
 const sc=st==='pre'?'vs':`${g.sport==='mma'?'':g.s.score[0]+' – '+g.s.score[1]}`;
 const mk=g._mk||[];
 return `<button class="crumb" data-nav="league-${g.lg}">← ${LG[g.lg].name}</button>
 <div class="gd"><div class="gdTop"><span>${LG[g.lg].icon} ${LG[g.lg].name} ${tag(g)}</span><span>${st==='live'?'<i class="dot"></i>LIVE':st==='final'?'FINAL':'UPCOMING'}</span></div>
 <div class="gdScore">${team(0)}<div class="gdS">${sc}<span class="c ${st}">${esc(clockText(g))}</span></div>${team(1,1)}</div>
 ${st!=='pre'||g.sims?wpHTML(g):''}${lineScore(g)}
 <div class="note">${g.real?`Live score and clock from ESPN${g.tv?' · 📺 Watch on '+esc(g.tv):''}${g.sit&&st==='live'?' · '+esc(g.sit):''}. PaceBook sets its own odds, starting from the market line.`:'Simulated matchup with real teams. This is not a real game.'}</div>
 ${st!=='final'?`<button class="bigWatch" data-watch="${g.id}">📺 ${st==='live'?'Watch Live — Arena Mode':'Open Arena — game starts soon'}</button>`:''}</div>
 ${st==='final'?'':mk.length?(lock?'<div class="warn" style="margin-top:12px">⏸ Scoring play under review — markets reopen in a moment.</div>':'')+mk.map(m=>mktHTML(m,lock)).join(''):'<div class="empty">Setting lines…</div>'}
 <div class="mk"><div class="mkh">Play-by-play</div><div class="feed">${feedHTML(g,25)}</div></div>`;
}
function viewBets(){
 const open=V.bets.filter(b=>b.status==='open'),done=V.bets.filter(b=>b.status!=='open');
 const won=done.filter(b=>b.status==='won'||b.status==='cashed'&&b.payout>b.stake).length,lost=done.filter(b=>b.status==='lost'||b.status==='cashed'&&b.payout<=b.stake).length;
 const net=done.reduce((a,b)=>a+(b.payout||0)-b.stake,0);

function betHTML(b){

  return `<div class="leg"><div class="li ${ic[1]}">${ic[0]}</div><div class="lt"><b>${esc(l.pk)}</b><small>${esc(l.mname)} · ${esc(l.game)}${live}</small></div><div class="lo">${fmtAm(l.am)}</div></div>`}).join('');

 <div class="bf"><span>Stake <b>${fmt(b.stake)}</b></span>${right}</div></div>`;
}
function amFromDec(d){return d>=2?Math.round((d-1)*100):-Math.round(100/(d-1))}

function renderSlip(){

 if(!items.length){$('#slip').innerHTML=head+`<div class="empty">Tap any odds to add a pick.<br><br><small>Add picks from 2+ games and switch to <b>Parlay</b> for a bigger payout.</small></div>`;return}
 const conflict=sameGameConflict(items);
 const body=items.map(it=>`<div class="si"><div class="r1"><b>${esc(it.pk)}</b><span class="so" data-so="${esc(it.key)}">${fmtAm(it.am)}</span><button class="sx" data-rm="${esc(it.key)}">×</button></div><div class="r2"><span>${esc(it.mname)} · ${esc(it.game)}</span></div>
  ${MODE==='single'?`<div class="stk"><input inputmode="numeric" placeholder="Stake" data-stake="${esc(it.key)}" value="${esc(it.stake)}"><button class="qs" data-qs="${esc(it.key)}" data-v="100">100</button><button class="qs" data-qs="${esc(it.key)}" data-v="500">500</button><button class="qs" data-qs="${esc(it.key)}" data-v="1000">1K</button></div><div class="tw" data-tw="${esc(it.key)}"></div>`:''}</div>`).join('');
 const foot=`<div class="sF">${MODE==='parlay'&&conflict?'<div class="warn">Two picks are from the same game. Remove one to build a parlay.</div>':''}${MODE==='parlay'&&items.length<2?'<div class="warn">Add at least 2 picks from different games.</div>':''}
  ${MODE==='parlay'?`<div class="row"><span>Parlay odds</span><b id="pOdds"></b></div><div class="stk" style="margin-bottom:8px"><input inputmode="numeric" placeholder="Parlay stake" id="pStake" value="${esc(PSTAKE)}"><button class="qs" data-pq="100">100</button><button class="qs" data-pq="500">500</button><button class="qs" data-pq="1000">1K</button></div>`:''}
  <div class="row"><span>Total stake</span><b id="tStake">0</b></div><div class="row"><span>Potential payout</span><b class="g" id="tPay">0</b></div>
  <label><input type="checkbox" id="accChk" checked> Accept odds changes</label><button class="btn" id="placeBtn">Place bet</button></div>`;
 $('#slip').innerHTML=head+`<div class="sTabs"><button class="tab ${MODE==='single'?'on':''}" data-mode="single">Singles</button><button class="tab ${MODE==='parlay'?'on':''}" data-mode="parlay">Parlay</button></div><div class="sB">${body}</div>`+foot;
 slipTotals();

function slipTotals(){
 const items=[...SLIP.values()];if(!items.length)return;let stake=0,pay=0;
 if(MODE==='single'){for(const it of items){const s=Math.floor(+it.stake)||0;stake+=s;pay+=s*dec(it.am);const tw=document.querySelector(`[data-tw="${CSS.escape(it.key)}"]`);if(tw)tw.innerHTML=s?`To win <b>${fmt(s*(dec(it.am)-1))}</b>`:''}}
 else{const d=items.reduce((a,it)=>a*dec(it.am),1);stake=Math.floor(+PSTAKE)||0;pay=stake*d;const po=$('#pOdds');if(po)po.textContent=fmtAm(amFromDec(d))}
 const a=$('#tStake'),b=$('#tPay');if(a)a.textContent=fmt(stake);if(b)b.textContent=fmt(pay);
 const pb=$('#placeBtn');if(pb){pb.disabled=!stake||stake>V.bal||(MODE==='parlay'&&(items.length<2||sameGameConflict(items)));pb.textContent=stake>V.bal?'Not enough coins':MODE==='parlay'?'Place parlay':'Place bet'+(items.filter(i=>+i.stake>0).length>1?'s':'')}
}
function updateSlipOdds(){
 for(const it of SLIP.values()){const el=document.querySelector(`[data-so="${CSS.escape(it.key)}"]`);if(!el)continue;const c=priceNow(it);
  if(c==null){el.textContent='Suspended';el.className='so sus'}else if(c!==it.am){el.innerHTML=`<s style="opacity:.5">${fmtAm(it.am)}</s> ${fmtAm(c)}`;el.className='so ch'}else{el.textContent=fmtAm(c);el.className='so'}}
}

let A=null;
function openArena(id){
 const g=gameById(id);if(!g)return;
 A={gid:g.id,seen:g.ln,ex:.15,pos:rnd()<.5?0:1,b:{x:.5,y:.5,tx:.5,ty:.5},hold:0,rt:0,pl:formation(vs(g.sport)),crowd:mkCrowd(g),t0:performance.now(),bases:[0,0,0],pitch:0,hit:null,ang:0};
 document.body.classList.add('arena-on');$('#slip').classList.remove('open');
 renderArena(true);if(SND.on)setCrowd(.12);requestAnimationFrame(frame);
}
function closeArena(){A=null;document.body.classList.remove('arena-on');$('#slip').classList.remove('open');if(SND.ctx)setCrowd(0);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
function mkCrowd(g){const c=[];const band=(n,x0,x1,y0,y1)=>{for(let i=0;i<n;i++){const r=rnd();c.push({x:x0+rnd()*(x1-x0),y:y0+rnd()*(y1-y0),c:r<.42?g.t[1].c:r<.75?g.t[0].c:pick(['#cfd6e6','#8792ab','#4b5571','#e8d9c0','#2b2f3d']),ph:rnd()*7,s:.7+rnd()*.6})}};
 band(150,0,1,.005,.085);band(150,0,1,.915,.995);band(55,.003,.07,.09,.91);band(55,.93,.997,.09,.91);c.sort((a,b)=>a.y-b.y);return c}
function formation(sp){
 const P=[],mir=(hx,hy)=>{P.push({team:0,hx,hy,x:hx,y:hy,ph:rnd()*6,f:1+rnd()*2});P.push({team:1,hx:1-hx,hy,x:1-hx,y:hy,ph:rnd()*6,f:1+rnd()*2})};
 const F={football:[[.46,.3],[.46,.4],[.46,.5],[.46,.6],[.46,.7],[.4,.5],[.36,.5],[.43,.18],[.43,.82],[.3,.35],[.3,.65]],
  basketball:[[.12,.5],[.25,.25],[.25,.75],[.38,.38],[.38,.62]],hockey:[[.07,.5],[.25,.3],[.25,.7],[.4,.5],[.38,.2],[.38,.8]],
  soccer:[[.04,.5],[.18,.2],[.17,.4],[.17,.6],[.18,.8],[.32,.3],[.3,.5],[.32,.7],[.44,.2],[.45,.5],[.44,.8]],tennis:[[.06,.5]],mma:[[.42,.5]]}[sp]||[];
 F.forEach(p=>mir(p[0],p[1]));return P;
}
const SHIFT={football:.1,basketball:.4,hockey:.2,soccer:.2};
function retarget(sp){const b=A.b,d=A.pos===0?1:-1;
 if(sp==='basketball'){b.tx=A.pos===0?.62+rnd()*.28:.1+rnd()*.28;b.ty=.2+rnd()*.6;if(rnd()<.35)A.pos=1-A.pos;return}
 b.tx=clamp(b.x+d*(rnd()*.2-.05),.07,.93);b.ty=clamp(b.y+(rnd()-.5)*.35,.12,.88);
 if(rnd()<.16||(d>0?b.tx>.86:b.tx<.14))A.pos=1-A.pos;
}
function onArenaEvent(g,e){
 if(e.k==='info'||!e.f)return;
 const big=e.k==='big';A.ex=Math.min(1,A.ex+(big?.85:.45));
 const fe=$('#flash');fe.textContent=e.f;fe.style.setProperty('--fc',e.t>=0?g.t[e.t].c:'#2f8cff');fe.classList.remove('show');void fe.offsetWidth;fe.classList.add('show');
 if(e.t>=0&&['football','basketball','hockey','soccer'].includes(vs(g.sport))){A.b.tx=e.t===0?.975:.025;A.b.ty=.5;A.pos=e.t;A.hold=1.8;A.reset=1}
 if(g.sport==='baseball'&&e.t>=0){A.hit={x:.5,y:.88,tx:big?.2+rnd()*.6:.3+rnd()*.4,ty:big?-.05:.3,t:0};A.bases=[0,0,0]}
 roar(big);
}
function frame(now){
 if(!A)return;const g=gameById(A.gid);if(!g){closeArena();return}
 const dt=Math.min(.05,(now-(A.last||now))/1000);A.last=now;const t=(now-A.t0)/1000;
 while(A.seen<g.ln){const idx=g.log.length-(g.ln-A.seen);const e=g.log[idx];if(e)onArenaEvent(g,e);A.seen++}
 A.ex+=(.15-A.ex)*dt*.5;
 const st=status(g),run=st==='live';
 if(run){A.rt-=dt;if(A.hold>0){A.hold-=dt;if(A.hold<=0&&A.reset){A.reset=0;A.b.tx=.5;A.b.ty=.5;A.pos=1-A.pos;A.rt=1}}else if(A.rt<=0){retarget(g.sport);A.rt=.7+rnd()*.9}}
 const k=Math.min(1,dt*(A.hold>0?2.5:1.6));A.b.x+=(A.b.tx-A.b.x)*k;A.b.y+=(A.b.ty-A.b.y)*k;
 drawArena(g,t,dt,run);
 requestAnimationFrame(frame);
}
function drawArena(g,t,dt,run){
 const cv=$('#cv'),W=cv.clientWidth,H=cv.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(!W||!H)return;
 if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
 const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0a0e1a');bg.addColorStop(1,'#04060c');c.fillStyle=bg;c.fillRect(0,0,W,H);
 const R=Math.max(2,H*.011);
 for(const p of A.crowd){const bob=Math.abs(Math.sin(t*(4+A.ex*6)+p.ph))*H*.009*(A.ex*1.2+.1);c.fillStyle=p.c;c.globalAlpha=.55+A.ex*.4;c.beginPath();c.arc(p.x*W,p.y*H-bob,R*p.s,0,7);c.fill()}
 c.globalAlpha=1;
 if(A.ex>.45)for(let i=0;i<12;i++){const p=pick(A.crowd);c.fillStyle='rgba(255,255,255,.9)';c.fillRect(p.x*W,p.y*H-R*2,1.6,1.6)}
 const fx=W*.08,fy=H*.1,fw=W*.84,fh=H*.8;
 drawField(c,g,fx,fy,fw,fh);
 drawActors(c,g,fx,fy,fw,fh,t,run);
 for(const [x,col] of [[.18,'rgba(120,170,255,'],[.82,'rgba(255,120,120,']]){const sx=W*(x+Math.sin(t*.4+x*9)*.08),gr=c.createRadialGradient(sx,H*.5,0,sx,H*.5,H*.6);gr.addColorStop(0,col+(.07+A.ex*.08)+')');gr.addColorStop(1,col+'0)');c.fillStyle=gr;c.fillRect(0,0,W,H)}
}
function drawField(c,g,x,y,w,h){
 const T=g.t,ln='rgba(255,255,255,.85)';c.save();c.lineWidth=Math.max(1.2,w*.0022);c.strokeStyle=ln;
 const rect=(a,b,ww,hh)=>c.strokeRect(x+a*w,y+b*h,ww*w,hh*h);
 switch(vs(g.sport)){
 case 'volleyball':{
  c.fillStyle='#e8a33d';c.fillRect(x+w*.08,y+h*.12,w*.84,h*.76);c.fillStyle=T[0].c+'40';c.fillRect(x+w*.08,y+h*.12,w*.14,h*.76);c.fillStyle=T[1].c+'40';c.fillRect(x+w*.78,y+h*.12,w*.14,h*.76);
  rect(.08,.12,.84,.76);c.beginPath();c.moveTo(x+w*.36,y+h*.12);c.lineTo(x+w*.36,y+h*.88);c.moveTo(x+w*.64,y+h*.12);c.lineTo(x+w*.64,y+h*.88);c.stroke();
  c.lineWidth=4;c.strokeStyle='#f5f5f5';c.beginPath();c.moveTo(x+w/2,y+h*.05);c.lineTo(x+w/2,y+h*.95);c.stroke();break}
 case 'football':{
  for(let i=0;i<10;i++){c.fillStyle=i%2?'#2e7a32':'#358a39';c.fillRect(x+w*(.1+i*.08),y,w*.08+1,h)}
  c.fillStyle=T[0].c;c.fillRect(x,y,w*.1,h);c.fillStyle=T[1].c;c.fillRect(x+w*.9,y,w*.1,h);
  for(let i=0;i<=10;i++){c.beginPath();c.moveTo(x+w*(.1+i*.08),y);c.lineTo(x+w*(.1+i*.08),y+h);c.stroke()}
  c.fillStyle='rgba(255,255,255,.6)';c.font=`700 ${h*.06}px Barlow Condensed`;c.textAlign='center';
  [10,20,30,40,50,40,30,20,10].forEach((n,i)=>{c.fillText(n,x+w*(.18+i*.08),y+h*.14);c.fillText(n,x+w*(.18+i*.08),y+h*.92)});
  c.font=`800 ${h*.1}px Barlow Condensed`;c.fillStyle='rgba(255,255,255,.85)';
  for(const [i,cx] of [[0,.05],[1,.95]]){c.save();c.translate(x+w*cx,y+h/2);c.rotate(i?Math.PI/2:-Math.PI/2);c.fillText(T[i].ab,0,h*.035);c.restore()}
  rect(0,0,1,1);break}
 case 'basketball':{
  const gr=c.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,'#c99558');gr.addColorStop(.5,'#d8a669');gr.addColorStop(1,'#c99558');c.fillStyle=gr;c.fillRect(x,y,w,h);
  c.fillStyle=T[0].c+'55';c.fillRect(x,y+h*.31,w*.19,h*.38);c.fillStyle=T[1].c+'55';c.fillRect(x+w*.81,y+h*.31,w*.19,h*.38);
  rect(0,0,1,1);c.beginPath();c.moveTo(x+w/2,y);c.lineTo(x+w/2,y+h);c.stroke();c.beginPath();c.arc(x+w/2,y+h/2,h*.13,0,7);c.stroke();
  rect(0,.31,.19,.38);rect(.81,.31,.19,.38);
  for(const [hx,dir] of [[.05,1],[.95,-1]]){c.beginPath();c.arc(x+w*hx,y+h/2,h*.47,dir>0?-Math.PI/2:Math.PI/2,dir>0?Math.PI/2:Math.PI*1.5);c.stroke();c.strokeStyle='#ff6a00';c.beginPath();c.arc(x+w*hx,y+h/2,h*.025,0,7);c.stroke();c.strokeStyle=ln}
  break}
 case 'hockey':{
  c.fillStyle='#eaf2fb';c.beginPath();c.roundRect(x,y,w,h,h*.18);c.fill();c.strokeStyle='#9aa8bb';c.stroke();

const SIMLG={cbb:'ncaam',volleyball:'ncaavb',football:'nfl',basketball:'nba',hockey:'nhl',baseball:'mlb',soccer:'epl',tennis:'atp',mma:'ufc'};
function repairGames(list){
 // saves from the first store build dropped each game's league and real-game info; rebuild them
 const out=[];
 for(const g of list){
  if(!g||!g.s||!g.t)continue;
  if(!g.lg){
   if(String(g.id).startsWith('r-')){const lg=String(g.id).split('-')[1];if(!LG[lg])continue;g.lg=lg;g.real=true;
    g.s=initState(g.sport);g.started=false;g.inited=false;g.finalAt=0;g.rst='pre';g.log=[];g.ln=0;g.prog=0}
   else g.lg=SIMLG[g.sport];
  }
  if(!LG[g.lg])continue;
  out.push(g);
 }
 return out;
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||d.v!==1)return false;
 Object.assign(V,{now:d.now,bal:d.bal,bets:d.bets||[],games:repairGames(d.games||[]),nid:d.nid,bonusAt:d.bonusAt||0,speed:d.speed||1});
 const away=clamp((Date.now()-d.real)/1000,0,3600);for(let x=0;x<away;x+=5)advance(Math.min(5,away-x));return true}catch(e){return false}}

$('#slipFab').onclick=()=>$('#slip').classList.toggle('open');
$('#aSlip').onclick=()=>$('#slip').classList.toggle('open');
$('#aClose').onclick=closeArena;
$('#aSound').onclick=soundToggle;
$('#aFull').onclick=()=>{const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(el.requestFullscreen)el.requestFullscreen().catch(()=>toast('Fullscreen is blocked here — try the open-in-new-tab view','warn'));else toast('Fullscreen not supported','warn')};
$('#speedSel').onchange=e=>{V.speed=+e.target.value;toast(`Game speed set to ${V.speed}×`)};
$('#bonusBtn').onclick=()=>{const ready=Date.now()-V.bonusAt>2*3600e3,broke=V.bal<50&&!V.bets.some(x=>x.status==='open');if(broke){V.bal+=2500;toast('Account refilled: +2,500 coins','ok')}else if(ready){V.bal+=1000;V.bonusAt=Date.now();toast('+1,000 free coins! Come back in 2 hours for more.','ok')}renderWallet();save()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&A)closeArena()});

/* ================= boot ================= */
if(!load()){initWorld();setTimeout(()=>toast('Welcome! You start with <b>10,000</b> play coins.','ok'),600)}
$('#speedSel').value=String(V.speed);
{const h=location.hash.slice(1);if(h)VIEW=h}
refreshSims(400);render();renderSlip();pollReal();setInterval(pollReal,5000);
let lastT=performance.now(),acc=0,saveAcc=0;
setInterval(()=>{
 const n=performance.now(),dt=Math.min(5,(n-lastT)/1000);lastT=n;
 advance(dt*V.speed);refreshSims(28);
 acc+=dt;saveAcc+=dt;
 if(A)renderArena(false);
 if(acc>=1){acc=0;renderMain();renderNav();renderWallet();updateSlipOdds();slipTotals()}
 if(saveAcc>=5){saveAcc=0;save()}
},250);
addEventListener('beforeunload',save);
</script>
</body>
</html>

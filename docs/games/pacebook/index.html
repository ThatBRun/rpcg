<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PaceBook">
<meta name="theme-color" content="#060a14">
<link rel="apple-touch-icon" href="../../icons/pacebook.png">
<link rel="icon" href="../../icons/pacebook.png">
<title>PaceBook — Play-Money Sportsbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060a14;--pan:#0d1426;--pan2:#131c33;--pan3:#1a2541;--line:#202c4b;--txt:#e8eeff;--mut:#8592b8;--acc:#2f8cff;--acc2:#6fb2ff;--win:#22c55e;--loss:#f05252;--gold:#fbbf24;--live:#ff3b3b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
.cond{font-family:'Barlow Condensed',Inter,sans-serif}
header.top{position:sticky;top:0;z-index:30;height:calc(58px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top) !important;display:flex;align-items:center;gap:14px;padding:0 16px;background:rgba(6,10,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;font-family:'Barlow Condensed';font-weight:800;font-size:24px;letter-spacing:1.5px;cursor:pointer;white-space:nowrap}
.logo svg{width:28px;height:28px;flex:none}
.logo span{color:var(--acc2)}
.logo small{font-family:Inter;font-weight:600;font-size:10px;letter-spacing:.4px;color:var(--mut);align-self:flex-end;margin-bottom:8px}
.hright{margin-left:auto;display:flex;align-items:center;gap:10px}
.speed{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px;white-space:nowrap}
select{background:var(--pan2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit}
.wallet{display:flex;align-items:center;gap:8px;background:var(--pan2);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.coin{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#fbbf24 45%,#b7791f);box-shadow:0 0 8px rgba(251,191,36,.5);display:inline-block;flex:none;vertical-align:-2px}
.btn{background:var(--acc);border:0;border-radius:10px;padding:9px 14px;font-weight:700;color:#fff}
.btn:hover{filter:brightness(1.12)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:var(--pan2);border:1px solid var(--line);color:var(--txt)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;min-height:calc(100vh - 58px);align-content:start}
nav.side{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
.nh{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);padding:12px 10px 6px;font-weight:700}
.ni{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:9px;text-align:left;font-weight:600;white-space:nowrap}
.ni:hover{background:var(--pan2)}
.ni.on{background:var(--pan3);box-shadow:inset 3px 0 0 var(--acc)}
.ni .ic{width:22px;text-align:center}
.ni .bd{margin-left:auto;font-size:11px;background:rgba(255,59,59,.15);color:#ff8080;padding:1px 7px;border-radius:999px;font-weight:700}
.ni .bd.b{background:rgba(47,140,255,.18);color:var(--acc2)}
.disc{font-size:11px;color:var(--mut);padding:16px 10px;line-height:1.55}
main{padding:18px 22px 90px;min-width:0}
h1,h2,h3{margin:0}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec h2{font-family:'Barlow Condensed';font-size:24px;letter-spacing:.5px;text-transform:uppercase}
.sec .ct{color:var(--mut);font-weight:600}
.sub{display:flex;align-items:center;gap:8px;margin:16px 0 8px;color:var(--mut);font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:12px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:26px 26px 24px;background:radial-gradient(ellipse at 85% -20%,rgba(47,140,255,.55),transparent 60%),radial-gradient(ellipse at 10% 120%,rgba(255,59,59,.35),transparent 55%),linear-gradient(135deg,#0f1a36,#0a1022);border:1px solid var(--line)}
.hero h1{font-family:'Barlow Condensed';font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.5px;max-width:560px}
.hero p{color:#b9c5e8;max-width:560px;margin:10px 0 16px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .lights{position:absolute;right:-30px;top:-30px;width:260px;height:260px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.07),transparent 30%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gcard{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;cursor:pointer;transition:border-color .15s}
.gcard:hover{border-color:#2d3d66}
.gcard.live{border-color:rgba(255,59,59,.28)}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:12px}
.lg{color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut)}
.clk.live{color:#ff8080}
.clk.final{color:var(--txt)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;animation:pulse 1.2s infinite;vertical-align:1px}
@keyframes pulse{50%{opacity:.25}}
.gr{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--n),78px);gap:6px;align-items:center;margin-top:5px}
.ch{font-size:11px;color:var(--mut);text-align:center;font-weight:600}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.sw{width:10px;height:22px;border-radius:3px;flex:none}
.tn{font-weight:600;font-size:13.5px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tn .sn{display:none}
.tn.mut{color:var(--mut);padding-left:18px}
.ts{margin-left:auto;font-family:'Barlow Condensed';font-size:22px;font-variant-numeric:tabular-nums;padding-right:4px}
.ts small{font-size:14px;color:var(--mut);margin-left:4px}
.ob{background:var(--pan2);border:1px solid var(--line);border-radius:9px;padding:5px 4px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:background .12s,border-color .12s;min-width:0}
.ob:hover{border-color:var(--acc);background:#16264a}
.ob .nm{font-size:11.5px;color:#c9d3f0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 4px}
.ob .ln{font-size:11.5px;color:var(--mut);font-weight:600}
.ob .od{font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}
.ob.on{background:var(--acc);border-color:var(--acc)}
.ob.on .od,.ob.on .ln,.ob.on .nm{color:#fff}
.ob.lock{opacity:.45;cursor:default}
.ob.lock:hover{border-color:var(--line);background:var(--pan2)}
.ob.done .od{color:var(--win)}
.ob.up{animation:up 1s}
.ob.dn{animation:dn 1s}
@keyframes up{0%{box-shadow:0 0 0 2px var(--win)}100%{box-shadow:none}}
@keyframes dn{0%{box-shadow:0 0 0 2px var(--loss)}100%{box-shadow:none}}
.gf{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.lnk{background:none;border:0;color:var(--acc2);font-weight:600;font-size:12.5px;padding:2px 0}
.watch{background:linear-gradient(90deg,#ff3b3b,#ff7a3b);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px}
.empty{color:var(--mut);padding:30px 10px;text-align:center}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.real{background:rgba(34,197,94,.18);color:#4ade80}
.tag.sim{background:rgba(133,146,184,.18);color:#a9b4d6}
.tv{font-size:11.5px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.info{margin-top:14px;background:rgba(47,140,255,.08);border:1px solid rgba(47,140,255,.3);border-radius:14px;padding:12px 14px;color:#c6d3f5;font-size:13px;line-height:1.5}
.note{font-size:12px;color:var(--mut);margin-top:12px}
.ltag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.6);color:#86efac;border:1px solid rgba(34,197,94,.45);letter-spacing:.3px;pointer-events:none}
.ltag.sim{color:#c7d2fe;border-color:rgba(129,140,248,.45)}
.lpb{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(5,8,16,.86);border:1px solid #24304f;border-left:5px solid var(--c,#2f8cff);border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;display:none;pointer-events:none;line-height:1.35}
.lpb small{color:var(--mut);margin-right:8px;font-weight:800}
.lpb.new{animation:lpbin .6s}
@keyframes lpbin{from{opacity:0;transform:translateY(12px)}}
.strow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);align-items:center}
.strow b{font-variant-numeric:tabular-nums}.strow b:last-child{text-align:right}.strow span{color:var(--mut);font-size:11.5px;font-weight:600;text-align:center}
.strow.hd b{font-family:'Barlow Condensed';font-size:16px;letter-spacing:.5px}
.lead{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;font-size:12px}
.lead div{display:flex;flex-direction:column;gap:4px}.lead i{display:block;width:100%;height:3px;border-radius:2px;margin-bottom:2px}
.lead small{color:var(--mut);font-weight:700;text-transform:uppercase;font-size:10px}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0}
.fxc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.fxt{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.fxt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:#10203f}
.fxt b{font-family:'Barlow Condensed';font-size:20px;text-transform:uppercase;letter-spacing:.4px}.fxt small{color:var(--mut)}.fxt span{font-size:12px;color:var(--gold);font-weight:700}
.fxbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.fxbar div{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.fxbar small{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase}.fxbar b{display:block;font-family:'Barlow Condensed';font-size:24px;font-variant-numeric:tabular-nums}
.fxslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px}
.fxs{display:flex;align-items:center;gap:8px;background:var(--pan2);border:1px dashed var(--line);border-radius:10px;padding:7px 9px;min-height:48px}.fxs.on{border-style:solid;border-color:#2d4a80}
.fxs .sx{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--pan3);color:var(--mut);font-size:17px;line-height:1}.fxs .sx:hover{color:var(--txt);border-color:var(--loss)}
.fxp{flex:none;min-width:40px;text-align:center;font-size:11px;font-weight:800;background:var(--pan3);color:var(--acc2);border-radius:6px;padding:3px 5px}
.fxn{flex:1;min-width:0}.fxn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}.fxn small{display:block;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxq{flex:1;min-width:160px;background:var(--pan2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;color:var(--txt)}.fxq:focus{outline:none;border-color:var(--acc)}
.fxlist{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.fxr{display:flex;align-items:center;gap:9px;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:7px 9px}.fxr.on{border-color:#2d4a80;background:#0f1a33}
.fxv{flex:none;text-align:right;min-width:52px}.fxv b{display:block;font-variant-numeric:tabular-nums}.fxv small{color:var(--mut);font-size:10.5px}
.fxa{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:20px;font-weight:800;line-height:1}.fxa:disabled{background:var(--pan3);color:var(--mut);cursor:not-allowed}.fxa.in{background:var(--win)}
.fxlb{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fxlr{display:flex;align-items:center;gap:10px;width:100%;background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left}.fxlr.me{border-color:var(--acc);background:#10203f}
.fxlr .rk{font-weight:800;width:38px}.fxlr .nm{flex:1;font-weight:700;min-width:0}.fxlr .nm small{display:inline-block;margin-left:8px;color:var(--mut);font-weight:600;font-size:11px;text-transform:capitalize}.fxlr .lf{color:var(--mut);font-size:12px}.fxlr b{font-family:'Barlow Condensed';font-size:22px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:760px){.fxc{grid-template-columns:1fr}.fxv{min-width:44px}.fxr{gap:6px;padding:7px}.fxp{min-width:34px}}
/* game detail */
.crumb{background:none;border:0;color:var(--acc2);font-weight:600;padding:0;margin-bottom:12px}
.gd{background:linear-gradient(180deg,#111b35,#0c1328);border:1px solid var(--line);border-radius:18px;padding:18px}
.gdTop{display:flex;align-items:center;justify-content:space-between;color:var(--mut);font-size:12.5px;font-weight:600}
.gdScore{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:14px 0}
.gdT{display:flex;align-items:center;gap:12px}
.gdT.r{flex-direction:row-reverse;text-align:right}
.badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:'Barlow Condensed';font-weight:800;font-size:18px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);flex:none}
.gdT b{display:block;font-size:17px}
.gdT small{color:var(--mut)}
.gdS{font-family:'Barlow Condensed';font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.gdS .c{display:block;font-size:15px;color:#ff8080;font-weight:700;letter-spacing:.5px}
.gdS .c.pre,.gdS .c.final{color:var(--mut)}
.wp{margin:6px 0 4px}
.wpb{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--pan2)}
.wpb i{display:block;height:100%;transition:width .6s}
.wpl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:600}
table.ls{border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums;font-size:13px}
table.ls th,table.ls td{padding:4px 9px;text-align:center}
table.ls th{color:var(--mut);font-weight:600;font-size:11.5px}
table.ls td:first-child,table.ls th:first-child{text-align:left;font-weight:700}
table.ls td.t{font-weight:800;color:#fff}
.lsw{overflow-x:auto}
.bigWatch{margin-top:14px;width:100%;padding:13px;border:0;border-radius:12px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(90deg,#ff3b3b,#ff7a3b 50%,#ffb03b);box-shadow:0 8px 30px rgba(255,80,60,.25);letter-spacing:.3px}
.mk{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.mkh{font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between}
.mkh small{color:var(--mut);font-weight:600}
.mkg{display:grid;gap:7px}
.mkg.c2{grid-template-columns:1fr 1fr}
.mkg.c3{grid-template-columns:1fr 1fr 1fr}
.mkg.c4{grid-template-columns:repeat(4,1fr)}
.pou{display:grid;grid-template-columns:1fr 92px 92px;gap:7px;align-items:center}
.pou .pn{font-weight:600}
.pou .pn small{color:var(--mut);margin-left:6px}
.feed{display:flex;flex-direction:column;gap:2px}
.fi{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.fi .fc{color:var(--mut);font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.fi.big .fx{font-weight:700}
.fi .fx i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* bets */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.stat b{display:block;font-family:'Barlow Condensed';font-size:28px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin:16px 0 10px}
.tab{background:var(--pan2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bet{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bet.won{border-color:rgba(34,197,94,.45)}
.bet.lost{opacity:.75}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bh b{font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.chip{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.chip.open{background:rgba(47,140,255,.18);color:var(--acc2)}
.chip.won{background:rgba(34,197,94,.18);color:#4ade80}
.chip.lost{background:rgba(240,82,82,.16);color:#ff8a8a}
.chip.cashed{background:rgba(251,191,36,.16);color:var(--gold)}
.chip.push{background:var(--pan3);color:var(--mut)}
.leg{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);align-items:start}
.leg:first-of-type{border-top:0}
.leg .li{font-weight:800;text-align:center}
.leg .li.w{color:var(--win)}.leg .li.l{color:var(--loss)}.leg .li.p{color:var(--mut)}
.leg .lt b{display:block}
.leg .lt small{color:var(--mut)}
.leg .lo{font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums}
.bf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;gap:10px;flex-wrap:wrap}
.bf span{color:var(--mut)}
.bf b{color:var(--txt);font-variant-numeric:tabular-nums}
.cash{background:linear-gradient(90deg,#f59e0b,#fbbf24);color:#1b1300;border:0;border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px}
/* slip */
aside.slip{border-left:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);display:flex;flex-direction:column;background:var(--pan);z-index:60}
.sH{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-family:'Barlow Condensed';font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.sH .n{background:var(--acc);color:#fff;font-family:Inter;font-size:12px;border-radius:999px;padding:1px 8px}
.sH .x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:22px;display:none}
.sH .clr{margin-left:auto;background:none;border:0;color:var(--mut);font-family:Inter;font-size:12px;font-weight:600;text-transform:none;letter-spacing:0}
.sTabs{display:flex;gap:6px;padding:0 14px 10px}
.sTabs .tab{flex:1}
.sB{flex:1;overflow:auto;padding:0 14px}
.si{background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px}
.si .r1{display:flex;gap:8px;align-items:flex-start}
.si .r1 b{flex:1;font-size:13.5px}

/* ================= simulation core ================= */
function initState(sp){
 const s={sp,u:0,score:[0,0],ps:[],ev:[],st:[[0,0,0],[0,0,0]],over:false,win:-1,ot:false};
 if(sp==='tennis'||sp==='volleyball'){s.cur=[0,0];s.srv=rnd()<.5?0:1;s.tg=0}
 if(sp==='mma'){s.method=null}
 return s;
}
function clone(s){const c=Object.assign({},s);c.score=s.score.slice();c.ps=s.ps.map(x=>x.slice());c.ev=s.ev.slice();c.st=s.st.map(x=>x.slice());if(s.cur)c.cur=s.cur.slice();return c}
function ensureP(s,pi){while(s.ps.length<=pi)s.ps.push([0,0])}
function sc(s,t,pts,pl,statAdd){s.score[t]+=pts;s.ps[s.ps.length-1][t]+=pts;s.ev.push(t);if(pl>=0)s.st[t][pl]+=statAdd}
function finish(s){s.over=true;if(s.win<0)s.win=s.score[0]>s.score[1]?0:s.score[1]>s.score[0]?1:2}
function rel(P,i){const home=P.indiv?0:(i===1?3:-3);return (P.tf||1)*Math.exp((P.r[i]-P.r[1-i]+home)*P.k)}
function wshare(P,i){const a=rel(P,0),b=rel(P,1);return i===0?a/(a+b):b/(a+b)}
function pickPl(sh){let r=rnd(),c=0;for(let i=0;i<sh.length;i++){c+=sh[i];if(r<c)return i}return -1}
function p1Done(s){if(s.over)return true;if(SP[s.sp].sets)return s.ps.length>=1;if(s.sp==='baseball')return s.u>=2;return s.u>=SP[s.sp].plen}
const PN=(P,t,i)=>i>=0?P.pl[t][i]:'A role player';

function hoops(s,P,L){
 const C=SP[s.sp],reg=C.reg,pl=C.plen;
 ensureP(s,s.u<reg?Math.floor(s.u/pl):C.np+Math.floor((s.u-reg)/5));
 for(let k=0;k<2;k++)for(const t of [0,1]){
  const m=rel(P,t)*C.eff,r=rnd();let pts=0;
  if(r<.125*m)pts=3;else if(r<.495*m)pts=2;else if(r<.55*m)pts=rnd()<.7?2:1;
  if(pts){const pl=pickPl(P.sh);sc(s,t,pts,pl,pts);
   if(L&&pts===3&&rnd()<.6)L(`${PN(P,t,pl)} drains a three for ${P.tn[t]}`,'score',t,'THREE!');
   else if(L&&pts===2&&rnd()<.08)L(`${PN(P,t,pl)} throws down a monster dunk!`,'score',t,'SLAM DUNK!');}
 }
 s.u++;
 if(L&&s.u<reg&&s.u%pl===0){if(s.u===reg/2)L('Halftime','info');else L(`End of the ${ord(s.u/pl)} ${C.pword}`,'info')}
 if(s.u>=reg&&(s.u-reg)%5===0){
  if(s.score[0]!==s.score[1])finish(s);
  else if(s.u>=reg+25){const t=rnd()<wshare(P,1)?1:0;sc(s,t,1,-1,0);finish(s)}
  else{s.ot=true;L&&L('All tied up — OVERTIME!','big',-1,'OVERTIME')}
 }
}

  for(const t of (rnd()<.5?[0,1]:[1,0])){

   if(r<.041*m){const pl=pickPl(P.sh);const x=rnd();const pts=x<.06?6:x<.11?8:7;sc(s,t,pts,pl,1);
    L&&L(`TOUCHDOWN ${P.tn[t]}! ${PN(P,t,pl)} finds the end zone`+(pts===6?' (PAT no good)':pts===8?' + 2-pt try good':''),'big',t,'TOUCHDOWN!');}
   else if(r<.068*m){sc(s,t,3,-1,0);L&&L(`Field goal is good — ${P.tn[t]} +3`,'score',t,'FIELD GOAL');}
   if(s.ot&&s.score[0]!==s.score[1]){s.u++;finish(s);L&&L(`${P.tn[s.win]} win it in overtime!`,'big',s.win,'WALK-OFF!');return}
  }

   if(bat===1&&inn>=8&&!hr){const need=s.score[0]-s.score[1]+1;if(need>0)runs=Math.min(runs,need)}

  if(s.u===18&&!s.over){s.ot=true;L&&L('Tied after nine — EXTRA INNINGS!','big',-1,'EXTRAS')}

  const reg=s.u<60;ensureP(s,reg?Math.floor(s.u/20):3);

    if(!reg){s.u++;finish(s);L&&L(`${P.tn[t]} win it in overtime!`,'big',t,'OT WINNER!');return}}
  }
  s.u++;
  if(L&&(s.u===20||s.u===40))L(`End of the ${s.u===20?'1st':'2nd'} period`,'info');
  if(s.u===60){if(s.score[0]===s.score[1]){s.ot=true;L&&L('Tied after regulation — OVERTIME!','big',-1,'OVERTIME')}else finish(s)}
  else if(s.u===65&&!s.over){const t=rnd()<wshare(P,1)?1:0;s.score[t]++;s.ps[s.ps.length-1][t]++;s.ev.push(t);s.so=true;finish(s);L&&L(`${P.tn[t]} win the shootout!`,'big',t,'SHOOTOUT WIN')}

  ensureP(s,s.u<45?0:1);

  if(L&&w!==sv&&rnd()<.7)L(`Break of serve! ${P.tn[w]} breaks ${P.tn[sv]}`,'score',w,'BREAK!');
  if(s.cur[0]===6&&s.cur[1]===6){w=rnd()<clamp(.5+(P.r[0]-P.r[1])*.006,.2,.8)?0:1;s.cur[w]=7;s.tg++;L&&L(`${P.tn[w]} takes the tiebreak`,'score',w,'TIEBREAK')}
  const a=s.cur[w],b=s.cur[1-w];
  if((a>=6&&a-b>=2)||a===7){s.ps.push(s.cur.slice());s.score[w]++;s.ev.push(w);L&&L(`${P.tn[w]} wins the set ${a}-${b}`,'big',w,'SET '+P.tn[w].toUpperCase());s.cur=[0,0];
   if(s.score[w]===2){finish(s);L&&L(`Game, set, match — ${P.tn[w]}!`,'big',w,'MATCH!')}}

   L&&L(sub?`${P.tn[w]} locks in a choke — the tap! Submission win!`:`${P.tn[w]} lands a huge shot — it's stopped! KO/TKO!`,'big',w,sub?'SUBMISSION!':'KNOCKOUT!');return}
  s.u++;
  if(s.u%5===0){const w=rnd()<clamp(wshare(P,0),.15,.85)?0:1;s.score[w]++;s.ps[rd][w]=10;s.ps[rd][1-w]=9;L&&L(`Round ${rd+1} to ${P.tn[w]} (10-9)`,'score',w,'ROUND '+(rd+1));
   if(s.u>=15){s.method='DEC';finish(s);L&&L(`${P.tn[s.win]} wins by decision`,'big',s.win,'DECISION')}}

function simulate(g,N){const P=params(g),f=STEP[g.sport],out=new Array(N);for(let n=0;n<N;n++){const c=clone(g.s);let k=0;while(!c.over&&k++<400)f(c,P,null);out[n]=c}return out}

/* ================= grading & pricing ================= */
function ou(v,q,over){if(q.k==='o'&&v>q.l)return 1;if(q.k==='u'&&v>q.l)return 0;if(!over)return null;return q.k==='o'?0:1}
function grade(s,q){
 switch(q.m){
  case 'ml':if(!s.over)return null;if(s.win===2&&!SP[s.sp].draw)return 2;return s.win===q.k?1:0;
  case 'sp':{if(!s.over)return null;const mg=s.score[1]-s.score[0];return q.k===1?(mg>q.l?1:0):(mg<q.l?1:0)}
  case 'tot':return ou(s.score[0]+s.score[1],q,s.over);
  case 'tt':return ou(s.score[q.t],q,s.over);
  case 'tg':return ou(s.tg,q,s.over);
  case 'ts':return ou(s.score[0]+s.score[1],q,s.over);
  case 'pou':return ou(s.st[q.t][q.i],q,s.over);
  case 'p1':{if(!p1Done(s))return null;const a=s.ps[0]||[0,0];const r=a[0]>a[1]?0:a[1]>a[0]?1:2;return r===q.k?1:0}
  case 'nx':if(s.ev.length>q.n)return s.ev[q.n]===q.k?1:0;if(s.over)return q.k===-1?1:0;return null;
  case 'any':if(s.st[q.t][q.i]>=q.l)return 1;return s.over?0:null;
  case 'sb':return s.over?(s.score[0]+'-'+s.score[1]===q.k?1:0):null;
  case 'meth':return s.over?(s.win===q.t&&s.method===q.k?1:0):null;
  case 'dist':return s.over?((s.method==='DEC')===(q.k==='y')?1:0):null;
  case 'ot':if(s.ot)return q.k==='y'?1:0;if(s.over)return q.k==='y'?0:1;return null;
  case 'btts':{const y=s.score[0]>0&&s.score[1]>0;if(y)return q.k==='y'?1:0;if(s.over)return q.k==='y'?0:1;return null}
 }

/* ================= sims scheduler ================= */
function needSims(g){
 if(isLive(g))return true;if(VIEW==='game-'+g.id||(A&&A.gid===g.id))return true;
 for(const it of SLIP.values())if(it.gid===g.id)return true;

}
function refreshSims(budget){
 const t0=performance.now(),cand=[];
 for(const g of V.games){
  if(g.s.over){if(g.sims||g._mk){g.sims=null;g._mk=[]}continue}
  const live=isLive(g),keep=needSims(g);let pri=-1;
  if(!g._simAt)pri=3;else if(keep&&!g.sims)pri=4;else if(live&&g._simSig!==sig(g))pri=5;else if(live&&!g._wasLive)pri=4;
  else if(live&&t0-g._simAt>2500&&g._simU!==g.s.u)pri=2;else if(!live&&t0-g._simAt>(keep?30000:300000))pri=1;
  if(!keep&&g.sims&&pri<0){g.sims=null}
  if(pri>=0)cand.push([pri,g._simAt||0,g]);
 }
 cand.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
 for(const [,,g] of cand){if(performance.now()-t0>budget)break;const live=isLive(g),keep=needSims(g);
  g.sims=simulate(g,live?350:keep?450:260);g._simAt=performance.now();g._simSig=sig(g);g._simU=g.s.u;g._wasLive=live;g._mk=markets(g);if(!keep)g.sims=null}
}

function clockText(g){
 const s=g.s,sp=g.sport;
 if(g.real){if(s.over)return g.void?'Postponed':(g.det||'Final');if(g.rst==='in')return g.det||'Live';return fmtStart(g.start)}
 if(s.over){let x='Final';if(sp==='baseball'&&s.u>18)x+=' / '+Math.ceil(s.u/2);else if(s.so)x+=' / SO';else if(s.ot)x+=' / OT';
  if(sp==='mma')x+=' · '+({KO:'KO/TKO',SUB:'Submission',DEC:'Decision'}[s.method])+(s.method!=='DEC'?' R'+(Math.floor((s.u-1)/5)+1):'');return x}
 if(V.now<g.start)return 'Starts in '+mmss((g.start-V.now)/60000);
 const p=Math.min(Math.max(g.prog,s.u),s.u+.999);
 switch(sp){
  case 'football':return p<60?`Q${Math.floor(p/15)+1} ${mmss(15-p%15)}`:`OT ${mmss(70-p)}`;
  case 'basketball':case 'cbb':case 'wbb':{const C=SP[sp];if(p<C.reg)return `${C.pn}${Math.floor(p/C.plen)+1} ${mmss(C.plen-p%C.plen)}`;const o=p-C.reg,n=Math.floor(o/5)+1;return `OT${n>1?n:''} ${mmss(5-o%5)}`}

 }

/* ================= dom patching (keeps buttons stable between live updates) ================= */
function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 if(a.nodeType!==1)return;
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
 for(const at of b.attributes)if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
 if(a.tagName==='INPUT'||a.tagName==='CANVAS')return;
 kids(a,b);
}
function kids(a,b){const fc=[...a.childNodes],tc=[...b.childNodes];for(let i=0;i<tc.length;i++){if(i<fc.length)morph(fc[i],tc[i]);else a.appendChild(tc[i])}for(let i=tc.length;i<fc.length;i++)fc[i].remove()}
function patch(el,html){const t=document.createElement(el.tagName);t.innerHTML=html;kids(el,t)}

function catMap(j){const m={};(j.categories||[]).forEach(c=>m[c.name]=c.names||[]);return m}
function statGet(cm,a,cat,name){const c=(a.categories||[]).find(x=>x.name===cat);if(!c)return 0;const i=(cm[cat]||[]).indexOf(name);return i<0?0:(+c.values[i]||0)}
function normPos(lg,p){p=String(p||'').toUpperCase();const S=FXSP[lg].sport;
 if(S==='bb'){if(lg==='ncaam')return p.includes('G')?'G':(p.includes('F')||p.includes('C'))?'F':null;return p.includes('C')&&!p.includes('G')?'C':p.includes('G')?'G':p.includes('F')?'F':null}
 if(S==='fb')return p==='QB'?'QB':(p==='RB'||p==='FB')?'RB':p==='WR'?'WR':p==='TE'?'TE':null;
 if(S==='hk')return p==='C'?'C':(p==='LW'||p==='RW'||p==='W'||p==='F')?'W':p==='D'?'D':p==='G'?'G':null;return null}
function seasonPlayer(lg,cm,a){
 const ath=a.athlete||{},pos=normPos(lg,ath.position&&ath.position.abbreviation);if(!pos||!ath.teamId)return null;
 const S=FXSP[lg].sport,g=(c,n)=>statGet(cm,a,c,n);let proj=0,line='';
 if(S==='bb'){const gp=g('general','gamesPlayed');if(gp<1||g('general','avgMinutes')<(lg==='ncaam'?10:8))return null;
  const pts=g('offensive','avgPoints'),reb=g('general','avgRebounds'),ast=g('offensive','avgAssists'),stl=g('defensive','avgSteals'),blk=g('defensive','avgBlocks'),to=g('offensive','avgTurnovers'),tpm=g('offensive','avgThreePointFieldGoalsMade');
  proj=pts+.5*tpm+1.25*reb+1.5*ast+2*stl+2*blk-.5*to+1.5*g('general','doubleDouble')/gp+1.5*g('general','tripleDouble')/gp;line=`${r1(pts)} pts · ${r1(reb)} reb · ${r1(ast)} ast`}
 else if(S==='fb'){const gp=g('general','gamesPlayed');if(gp<1)return null;const pg=x=>x/gp;
  const py=pg(g('passing','passingYards')),ptd=pg(g('passing','passingTouchdowns')),int=pg(g('passing','interceptions')),ry=pg(g('rushing','rushingYards')),rtd=pg(g('rushing','rushingTouchdowns')),rec=pg(g('receiving','receptions')),recy=pg(g('receiving','receivingYards')),rectd=pg(g('receiving','receivingTouchdowns')),fl=pg(g('rushing','rushingFumblesLost')+g('receiving','receivingFumblesLost'));
  proj=.04*py+4*ptd-int+.1*ry+6*rtd+.5*rec+.1*recy+6*rectd-2*fl;if(proj<2)return null;
  line=pos==='QB'?`${Math.round(py)} pass yds · ${r1(ptd)} TD · ${Math.round(ry)} rush yds`:pos==='RB'?`${Math.round(ry)} rush yds · ${r1(rec)} rec · ${r1(rtd+rectd)} TD`:`${r1(rec)} rec · ${Math.round(recy)} yds · ${r1(rectd)} TD`}
 else if(S==='hk'){const gp=g('general','games');if(gp<1)return null;
  if(pos==='G'){const sv=g('defensive','saves')/gp,ga=g('defensive','goalsAgainst')/gp,w=g('general','wins')/gp,so=g('defensive','shutouts')/gp;proj=.7*sv-3.5*ga+6*w+4*so;const spc=g('defensive','savePct');line=`${(spc>1?spc:spc*100).toFixed(1)}% SV · ${r1(g('defensive','avgGoalsAgainst'))} GAA · ${gp} GP`}
  else{const G=g('offensive','goals')/gp,A=g('offensive','assists')/gp,S2=g('offensive','shotsTotal')/gp;proj=8.5*G+5*A+1.5*S2+1.3*(pos==='D'?1.1:.45);line=`${r1(G*gp)} G · ${r1(A*gp)} A · ${r1(S2)} SOG/gm`}}
 return{id:String(ath.id),name:ath.displayName||ath.shortName||'?',pos,tid:String(ath.teamId),proj:Math.max(0,proj),line,gp:pos==='G'?statGet(cm,a,'general','games'):0};
}

function fxSlates(lg){const by={};for(const g of V.games){if(!g.real||g.lg!==lg||g.void)continue;const d=etDate(g.start);(by[d]=by[d]||[]).push(g)}
 return Object.keys(by).sort().map(d=>({date:d,games:by[d],open:by[d].filter(g=>status(g)==='pre')})).filter(s=>s.open.length).slice(0,3)}
function slateLabel(d){const t=etDate(Date.now()),tm=etDate(Date.now()+864e5);if(d===t)return 'Today';if(d===tm)return 'Tomorrow';const dt=new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8));return dt.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}
function fxPool(lg,date){
 const key=lg+date,c=FX.poolCache[key];if(c&&Date.now()-c.at<20000)return c.pool;
 const st=FX.st[lg];if(!st||!st.map.size)return [];
 const F=FXSP[lg],teams={};
 for(const g of V.games)if(g.real&&g.lg===lg&&!g.void&&etDate(g.start)===date&&status(g)==='pre')g.t.forEach((t,i)=>{if(t.tid)teams[String(t.tid)]={g,i}});
 let list=[];for(const p of st.map.values()){const m=teams[p.tid];if(!m)continue;list.push(Object.assign({},p,{gid:m.g.id,ev:m.g.id.split('-')[2],team:m.g.t[m.i].ab,opp:(m.i===1?'vs ':'@ ')+m.g.t[1-m.i].ab,start:m.g.start}))}
 // per-team depth limits; goalies weighted by share of starts
 const byTeam={};for(const p of list)(byTeam[p.tid]=byTeam[p.tid]||[]).push(p);list=[];
 for(const tid in byTeam){const arr=byTeam[tid].sort((a,b)=>b.proj-a.proj);
  if(F.sport==='fb'){const cnt={};for(const p of arr){cnt[p.pos]=(cnt[p.pos]||0)+1;if(cnt[p.pos]<=F.perTeam[p.pos])list.push(p)}}
  else if(F.sport==='hk'){const gs=arr.filter(p=>p.pos==='G').sort((a,b)=>b.gp-a.gp).slice(0,2),tot=gs.reduce((a,p)=>a+p.gp,0)||1;gs.forEach(p=>{p.proj=p.proj*Math.min(1,p.gp/tot*1.25);p.line+=` · ${Math.round(p.gp/tot*100)}% of starts`});list.push(...gs,...arr.filter(p=>p.pos!=='G').slice(0,F.perTeam))}
  else list.push(...arr.slice(0,F.perTeam))}
 list.sort((a,b)=>b.proj-a.proj);const top=list.length?Math.max(...list.slice(0,3).map(p=>p.proj)):1;
 for(const p of list){p.proj=r1(p.proj);p.sal=Math.round((F.smin+(F.smax-F.smin)*Math.pow(clamp(p.proj/top,0,1),1.15))/100)*100}
 FX.poolCache[key]={at:Date.now(),pool:list};return list;
}

/* ---- lineup optimizer (used by the AIs and Auto-fill) ---- */
function optimize(pool,slots,cap,fixed,val){
 const elig=(i,p)=>slots[i][1].includes(p.pos),minSal=pool.length?Math.min(...pool.map(p=>p.sal)):0;let best=null,bestV=-1;
 for(let r=0;r<6;r++){
  const L=fixed.slice(),used=new Set(L.filter(Boolean).map(p=>p.id));let sal=L.reduce((a,p)=>a+(p?p.sal:0),0);
  const empty=slots.map((s,i)=>i).filter(i=>!L[i]).sort((a,b)=>pool.filter(p=>elig(a,p)).length-pool.filter(p=>elig(b,p)).length);
  for(let k=0;k<empty.length;k++){const i=empty[k],left=empty.length-k-1,jit=r?.25:0;
   const c=pool.filter(p=>elig(i,p)&&!used.has(p.id)).map(p=>[p,val(p)*(1+jit*(rnd()-.5))]).sort((a,b)=>b[1]-a[1]);
   let pick=c.find(([p])=>sal+p.sal+left*minSal<=cap);if(!pick)pick=c.sort((a,b)=>a[0].sal-b[0].sal)[0];if(!pick)break;
   L[i]=pick[0];used.add(pick[0].id);sal+=pick[0].sal}
  for(let pass=0;pass<5;pass++){let imp=false;
   for(let i=0;i<slots.length;i++){if(fixed[i]||!L[i])continue;let bi=null,bg=0;
    for(const p of pool){if(used.has(p.id)||!elig(i,p))continue;if(sal-L[i].sal+p.sal>cap)continue;const gn=val(p)-val(L[i]);if(gn>bg+1e-9){bg=gn;bi=p}}
    if(bi){used.delete(L[i].id);sal+=bi.sal-L[i].sal;L[i]=bi;used.add(bi.id);imp=true}}
   if(!imp)break}
  if(L.some(p=>!p)||sal>cap)continue;const tv=L.reduce((a,p)=>a+val(p),0);if(tv>bestV){bestV=tv;best=L}
 }
 return best;
}
function aiLineup(lg,pool,pers,usedCount){
 const F=FXSP[lg],P=PERS[pers],avg=pool.reduce((a,p)=>a+p.sal,0)/Math.max(1,pool.length),nz={};
 for(const p of pool)nz[p.id]=1+P.noise*randn();
 const val=p=>Math.max(.1,p.proj*nz[p.id]*(P.stars?Math.pow(p.sal/avg,P.stars):1)*(P.fade&&usedCount[p.id]?Math.pow(P.fade,usedCount[p.id]):1));
 return optimize(pool,F.slots,F.cap,F.slots.map(()=>null),val);
}

/* ---- box scores & fantasy points ---- */
function num(v){v=String(v==null?'':v);if(v.includes(':')){const [m,s]=v.split(':');return (+m||0)+(+s||0)/60}const n=parseFloat(v);return isNaN(n)?0:n}
function parseBox(sport,j){
 const st={},goalies={};let win=null;
 try{const cs=j.header.competitions[0].competitors;const w=cs.find(c=>c.winner);if(w)win=String(w.id||w.team&&w.team.id)}catch(e){}
 for(const tb of (j.boxscore&&j.boxscore.players)||[]){const tid=String(tb.team&&tb.team.id);
  for(const grp of tb.statistics||[]){const keys=grp.keys||[],pre=sport==='fb'?(grp.name||'')+'.':'';
   for(const a of grp.athletes||[]){const id=String(a.athlete&&a.athlete.id),o=st[id]||(st[id]={tid}),vals=a.stats||[];
    keys.forEach((k,ix)=>{const v=vals[ix];if(v==null||v==='')return;const ks=k.split(/[\/-]/),vs=String(v).replace(/^\+/,'').split(/[\/]|(?<=\d)-/);
     if(ks.length>1&&vs.length===ks.length)ks.forEach((kk,jj)=>o[pre+kk]=num(vs[jj]));else o[pre+k]=num(v)});
    if(sport==='hk'&&grp.name==='goalies'){o.goalie=true;(goalies[tid]=goalies[tid]||[]).push({id,toi:o.timeOnIce||0})}}}}
 return{st,goalies,win};
}
function fpOf(sport,o,box,id){
 if(!o)return{fp:0,line:'—'};let fp=0,line='';
 if(sport==='bb'){const pts=o.points||0,reb=o.rebounds||0,ast=o.assists||0,stl=o.steals||0,blk=o.blocks||0,to=o.turnovers||0,tpm=o.threePointFieldGoalsMade||0;
  const tens=[pts,reb,ast,stl,blk].filter(x=>x>=10).length;fp=pts+.5*tpm+1.25*reb+1.5*ast+2*stl+2*blk-.5*to+(tens>=3?3:tens>=2?1.5:0);
  line=o.minutes===undefined&&!pts?'DNP':`${pts} pts · ${reb} reb · ${ast} ast${stl?` · ${stl} stl`:''}${blk?` · ${blk} blk`:''}`}
 else if(sport==='fb'){const g=k=>o[k]||0;fp=.04*g('passing.passingYards')+4*g('passing.passingTouchdowns')-g('passing.interceptions')+.1*g('rushing.rushingYards')+6*g('rushing.rushingTouchdowns')+.5*g('receiving.receptions')+.1*g('receiving.receivingYards')+6*g('receiving.receivingTouchdowns')-2*g('fumbles.fumblesLost')+6*(g('kickReturns.kickReturnTouchdowns')+g('puntReturns.puntReturnTouchdowns'));
  const parts=[];if(o['passing.passingAttempts'])parts.push(`${g('passing.completions')}/${g('passing.passingAttempts')} · ${g('passing.passingYards')} yds · ${g('passing.passingTouchdowns')} TD${g('passing.interceptions')?` · ${g('passing.interceptions')} INT`:''}`);
  if(o['rushing.rushingAttempts'])parts.push(`${g('rushing.rushingAttempts')} car ${g('rushing.rushingYards')} yds${g('rushing.rushingTouchdowns')?` ${g('rushing.rushingTouchdowns')} TD`:''}`);
  if(o['receiving.receptions']||o['receiving.receivingTargets'])parts.push(`${g('receiving.receptions')} rec ${g('receiving.receivingYards')} yds${g('receiving.receivingTouchdowns')?` ${g('receiving.receivingTouchdowns')} TD`:''}`);line=parts.join(' · ')||'No stats yet'}
 else if(sport==='hk'){if(o.goalie){const sv=o.saves||0,ga=o.goalsAgainst||0;fp=.7*sv-3.5*ga;
   if(box&&box.final){const mine=(box.goalies[o.tid]||[]).sort((a,b)=>b.toi-a.toi)[0];const main=mine&&mine.id===id;if(main&&box.win===o.tid)fp+=6;if(main&&ga===0&&(o.timeOnIce||0)>=55)fp+=4}
   line=`${sv} SV · ${ga} GA`}
  else{const G=o.goals||0,A=o.assists||0,S=o.shotsTotal||0,B=o.blockedShots||0;fp=8.5*G+5*A+1.5*S+1.3*B;line=`${G} G · ${A} A · ${S} SOG${B?` · ${B} BS`:''}`}}
 return{fp:r1(fp),line};
}
async function fetchBox(lg,ev){
 FX.boxAt[ev]=Date.now();
 const j=await getJSON(`${ESPN}${LG[lg].path}/summary?event=${ev}`);const b=parseBox(FXSP[lg].sport,j);b.at=Date.now();FX.box[ev]=b;return b;
}
function applyBox(c,ev,box){const S=FXSP[c.lg].sport;for(const pid in c.players){const p=c.players[pid];if(p.ev!==ev)continue;c.pts[pid]=fpOf(S,box.st[pid],box,pid)}}
const entryPts=(c,e)=>r1(e.lineup.reduce((a,pid)=>a+((c.pts[pid]&&c.pts[pid].fp)||0),0));
function playerState(c,pid){const p=c.players[pid],g=gameById(p.gid);if(!g)return 'pre';if(g.void)return 'final';return status(g)}
function standings(c){const rows=c.entries.map((e,i)=>({i,e,pts:entryPts(c,e),left:e.lineup.filter(pid=>playerState(c,pid)!=='final').length}));rows.sort((a,b)=>b.pts-a.pts||(a.e.you?-1:b.e.you?1:0));let r=1;rows.forEach((x,k)=>{if(k&&x.pts<rows[k-1].pts)r=k+1;x.rank=r});return rows}
function settleContest(c){
 const T=FXTYPES[c.type],rows=standings(c),pot=T.pay;
 const groups={};rows.forEach((x,k)=>{(groups[x.pts]=groups[x.pts]||[]).push(k)});
 rows.forEach(x=>x.pay=0);for(const pts in groups){const ks=groups[pts],share=ks.reduce((a,k)=>a+(pot[k]||0),0)/ks.length;ks.forEach(k=>rows[k].pay=share)}
 const me=rows.find(x=>x.e.you);let pay=Math.round(me.pay*c.fee);if(c.type==='h2h'&&rows[0].pts===rows[1].pts)pay=c.fee;
 c.status='final';c.rank=me.rank;c.payout=pay;c.finalAt=Date.now();V.bal+=pay;
 toast(pay>c.fee?`🏆 Fantasy: you finished ${ord(me.rank)} of ${rows.length} — +${fmt(pay)} coins!`:pay?`Fantasy: ${ord(me.rank)} of ${rows.length} — ${fmt(pay)} coins back`:`Fantasy: ${ord(me.rank)} of ${rows.length}. The AIs got you this time.`,pay>c.fee?'ok':pay?'':'bad');
 renderWallet();save();
}
async function fantasyTick(){
 if(FX.busy||REAL.ok!==true)return;const open=(V.fantasy||[]).filter(c=>c.status!=='final');if(!open.length)return;FX.busy=true;let n=0;
 try{for(const c of open){
  const evs=[...new Set(Object.values(c.players).map(p=>p.ev))];
  for(const ev of evs){if(n>=4)break;const p=Object.values(c.players).find(x=>x.ev===ev),g=gameById(p.gid);c.done=c.done||{};if(c.done[ev])continue;
   if(!g)continue;if(g.void){c.done[ev]=true;continue}const stt=status(g);
   if(stt==='live'&&Date.now()-(FX.boxAt[ev]||0)>30000){n++;try{applyBox(c,ev,await fetchBox(c.lg,ev))}catch(e){}}
   else if(stt==='final'){n++;try{const b=await fetchBox(c.lg,ev);b.final=true;applyBox(c,ev,b);c.done[ev]=true}catch(e){}}}
  if(c.status!=='final'&&evs.every(ev=>c.done&&c.done[ev]))settleContest(c);
 }}finally{FX.busy=false}
}
function enterContest(){
 const F=FXSP[FB.lg],T=FXTYPES[FB.type],pool=fxPool(FB.lg,FB.date),byId=new Map(pool.map(p=>[p.id,p]));
 const L=FB.picks.map(p=>p&&byId.get(p.id));if(L.some(p=>!p)){FB.picks=FB.picks.map((p,i)=>L[i]||null);lastMainHTML='';renderMain();return toast('A player\'s game already started — pick someone else for that spot','warn')}
 const sal=L.reduce((a,p)=>a+p.sal,0);if(sal>F.cap)return toast('Over the salary cap','warn');if(V.bal<FB.fee)return toast('Not enough coins','bad');
 const entries=[{name:'You',you:true,lineup:L.map(p=>p.id)}],used={},names=AIS.slice().sort(()=>rnd()-.5);
 L.forEach(p=>used[p.id]=(used[p.id]||0)+1);
 for(let k=0;k<T.n-1;k++){const [nm,pers]=names[k%names.length];const AL=aiLineup(FB.lg,pool,pers,used);if(!AL)return toast('Not enough players on this slate for that contest','warn');AL.forEach(p=>used[p.id]=(used[p.id]||0)+1);entries.push({name:nm,pers,lineup:AL.map(p=>p.id)})}
 const players={};for(const e of entries)for(const pid of e.lineup){const p=byId.get(pid);players[pid]={id:p.id,name:p.name,pos:p.pos,team:p.team,opp:p.opp,sal:p.sal,proj:p.proj,gid:p.gid,ev:p.ev}}
 V.bal-=FB.fee;const c={id:'f'+(V.nid++),lg:FB.lg,date:FB.date,type:FB.type,fee:FB.fee,entries,players,pts:{},done:{},status:'open',at:Date.now(),slots:F.slots.map(s=>s[0])};
 (V.fantasy=V.fantasy||[]).unshift(c);FB=null;renderWallet();save();toast(`Entered ${T.name}: you vs ${T.n-1} AI${T.n>2?'s':''}. Good luck!`,'ok');go('fantasy-c-'+c.id);
}
function fxPinned(){const s=new Set();for(const c of V.fantasy||[])if(c.status!=='final')for(const pid in c.players)s.add(c.players[pid].gid);return s}

/* ---- fantasy views ---- */
function fxTabs(cur,list,attr){return `<div class="tabs" style="flex-wrap:wrap">${list.map(([k,l])=>`<button class="tab ${k===cur?'on':''}" data-${attr}="${esc(k)}">${l}</button>`).join('')}</div>`}
function viewFantasy(){
 const lg=FXUI.lg,F=FXSP[lg],mine=V.fantasy||[],live=mine.filter(c=>c.status!=='final'),done=mine.filter(c=>c.status==='final');
 const net=done.reduce((a,c)=>a+c.payout-c.fee,0),wins=done.filter(c=>c.rank===1).length;
 let h=`<div class="sec"><h2>🏆 Fantasy vs AI</h2></div>
 <div class="note" style="margin-top:0">Build a lineup from real players in real games. They score fantasy points from their real stats, live. Beat the AI managers to win coins.</div>
 <div class="stats" style="margin-top:12px"><div class="stat"><small>Contests</small><b>${done.length}</b></div><div class="stat"><small>Wins</small><b>${wins}</b></div><div class="stat"><small>Live</small><b>${live.length}</b></div><div class="stat"><small>Net</small><b style="color:${net>=0?'var(--win)':'var(--loss)'}">${net>=0?'+':''}${fmt(net)}</b></div></div>`;
 h+=fxTabs(lg,Object.keys(FXSP).map(k=>[k,LG[k].icon+' '+(k==='ncaam'?'College Hoops':LG[k].name)]),'fxlg');
 if(REAL.ok!==true)h+=realBox();
 else{const sl=fxSlates(lg);if(!sl.some(s=>s.date===FXUI.date))FXUI.date=sl[0]&&sl[0].date;
  if(!sl.length)h+=`<div class="empty">No ${LG[lg].name} games left to draft in the next 3 days. Try another sport.</div>`;
  else{const S=sl.find(s=>s.date===FXUI.date),st=FX.st[lg];if(!st||(!st.at&&!st.loading&&!st.failed))loadStats(lg);
   h+=fxTabs(FXUI.date,sl.map(s=>[s.date,`${slateLabel(s.date)} · ${s.open.length} game${s.open.length>1?'s':''}`]),'fxdate');
   const pool=fxPool(lg,FXUI.date);
   if(st&&st.loading&&!pool.length)h+='<div class="empty">⏳ Loading player stats…</div>';
   else if(!pool.length)h+=`<div class="empty">${st&&st.failed?'Could not load player stats. <button class="lnk" data-fxretry="1">Try again</button>':'No players found for these games yet.'}</div>`;
   else{h+=`<div class="fxc">${Object.entries(FXTYPES).map(([k,T])=>`<button class="fxt ${FXUI.type===k?'on':''}" data-fxtype="${k}"><b>${T.name}</b><small>${T.desc}</small><span>${T.pay.map((x,i)=>`${ord(i+1)}: ${fmt(x*FXUI.fee)}`).join(' · ')}</span></button>`).join('')}</div>
    <div class="row2"><span class="note" style="margin:0">Entry fee</span>${FXFEES.map(f=>`<button class="tab ${FXUI.fee===f?'on':''}" data-fxfee="${f}">${fmt(f)}</button>`).join('')}</div>
    <button class="bigWatch" style="background:linear-gradient(90deg,#2f8cff,#6fb2ff)" data-fxbuild="1" ${V.bal<FXUI.fee?'disabled':''}>${V.bal<FXUI.fee?'Not enough coins':`Build lineup · ${S.open.length} game${S.open.length>1?'s':''} · ${pool.length} players →`}</button>
    <div class="note">Lineup: ${F.slots.map(s=>s[0]).join(', ')} · Salary cap ${money(F.cap)}<br>Scoring: ${F.rules}</div>`}}}
 const card=c=>{const T=FXTYPES[c.type],rows=standings(c),me=rows.find(x=>x.e.you),st=c.status==='final';
  return `<div class="bet ${st?(c.payout>c.fee?'won':c.payout?'':'lost'):''}" data-fxopen="${c.id}" style="cursor:pointer"><div class="bh"><b>${LG[c.lg].icon} ${LG[c.lg].name} · ${T.name} · ${slateLabel(c.date)}</b><span class="chip ${st?(c.payout>c.fee?'won':c.payout?'push':'lost'):'open'}">${st?(c.payout>c.fee?'Won':c.payout?'Paid':'Lost'):'Live'}</span></div>
  <div class="bf" style="border-top:0;margin-top:0;padding-top:0"><span>You: <b>${ord(me.rank)} of ${rows.length}</b> · <b>${me.pts}</b> pts${st?'':` · ${me.left} players left`}</span><span>Entry <b>${fmt(c.fee)}</b>${st?` · Won <b>${fmt(c.payout)}</b>`:''}</span></div></div>`};
 if(live.length)h+=`<div class="sub">My live contests</div>${live.map(card).join('')}`;
 if(done.length)h+=`<div class="sub">Completed</div>${done.slice(0,15).map(card).join('')}`;
 return h;
}
function viewBuild(){
 if(!FB)return viewFantasy();const F=FXSP[FB.lg],T=FXTYPES[FB.type],pool=fxPool(FB.lg,FB.date);
 const sal=FB.picks.reduce((a,p)=>a+(p?p.sal:0),0),proj=r1(FB.picks.reduce((a,p)=>a+(p?p.proj:0),0)),full=FB.picks.every(Boolean),left=F.cap-sal,ids=new Set(FB.picks.filter(Boolean).map(p=>p.id));
 const pos=[...new Set(F.slots.flatMap(s=>s[1]))],q=FB.q.trim().toLowerCase();
 let list=pool.filter(p=>(FB.pos==='ALL'||p.pos===FB.pos)&&(!q||p.name.toLowerCase().includes(q)||p.team.toLowerCase()===q));
 list.sort(FB.sort==='sal'?(a,b)=>b.sal-a.sal:FB.sort==='value'?(a,b)=>b.proj/b.sal-a.proj/a.sal:(a,b)=>b.proj-a.proj);
 const canAdd=p=>!ids.has(p.id)&&FB.picks.some((x,i)=>!x&&F.slots[i][1].includes(p.pos))&&p.sal<=left;
 return `<button class="crumb" data-nav="fantasy">← Fantasy</button>
 <div class="gd"><div class="gdTop"><span>${LG[FB.lg].icon} ${LG[FB.lg].name} · ${slateLabel(FB.date)}</span><span>${T.name} · Entry ${fmt(FB.fee)}</span></div>
 <div class="fxbar"><div><small>Salary left</small><b style="color:${left<0?'var(--loss)':'var(--txt)'}">${money(left)}</b></div><div><small>Projected</small><b>${proj}</b></div><div><small>Players</small><b>${FB.picks.filter(Boolean).length}/${F.slots.length}</b></div></div>
 <div class="fxslots">${F.slots.map((s,i)=>{const p=FB.picks[i];return `<div class="fxs ${p?'on':''}"><span class="fxp">${s[0]}</span>${p?`<div class="fxn"><b>${esc(p.name)}</b><small>${esc(p.team)} ${esc(p.opp)} · ${money(p.sal)} · ${p.proj}</small></div><button class="sx" data-fxrm="${i}">×</button>`:'<div class="fxn"><small>Empty</small></div>'}</div>`}).join('')}</div>
 <div class="row2" style="margin-top:12px"><button class="btn ghost sm" data-fxauto="1">✨ Auto-fill</button><button class="btn ghost sm" data-fxclear="1">Clear</button><button class="btn" style="margin-left:auto" data-fxenter="1" ${full&&left>=0&&V.bal>=FB.fee?'':'disabled'}>${full?(left<0?'Over the cap':`Enter vs ${T.n-1} AI${T.n>2?'s':''} · ${fmt(FB.fee)}`):'Fill every spot'}</button></div></div>
 <div class="row2" style="margin-top:14px">${['ALL',...pos].map(p=>`<button class="tab ${FB.pos===p?'on':''}" data-fxpos="${p}">${p}</button>`).join('')}</div>
 <div class="row2"><input class="fxq" data-fxq="1" placeholder="Search player or team (e.g. LAL)" value="${esc(FB.q)}"><span class="note" style="margin:0">Sort</span>${[['proj','Proj'],['sal','Salary'],['value','Value']].map(([k,l])=>`<button class="tab ${FB.sort===k?'on':''}" data-fxsort="${k}">${l}</button>`).join('')}</div>
 <div class="fxlist">${list.slice(0,150).map(p=>`<div class="fxr ${ids.has(p.id)?'on':''}"><span class="fxp">${p.pos}</span><div class="fxn"><b>${esc(p.name)}</b><small>${esc(p.team)} ${esc(p.opp)} · ${new Date(p.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} · ${esc(p.line)}</small></div><div class="fxv"><b>${p.proj}</b><small>proj</small></div><div class="fxv"><b>${money(p.sal)}</b></div>
  ${ids.has(p.id)?`<button class="fxa in" data-fxrmid="${esc(p.id)}">✓</button>`:`<button class="fxa" data-fxadd="${esc(p.id)}" ${canAdd(p)?'':'disabled'}>+</button>`}</div>`).join('')||'<div class="empty">No players match.</div>'}
 ${list.length>150?`<div class="empty" style="padding:10px">Showing the top 150 of ${list.length}. Search to find more.</div>`:''}</div>`;
}
function viewContest(id){
 const c=(V.fantasy||[]).find(x=>x.id===id);if(!c)return `<div class="empty">Contest not found.<br><br><button class="btn" data-nav="fantasy">Back to Fantasy</button></div>`;
 const T=FXTYPES[c.type],rows=standings(c),S=FXSP[c.lg],fin=c.status==='final';
 const lineup=e=>`<div class="fxlist">${e.lineup.map((pid,i)=>{const p=c.players[pid],ps=c.pts[pid],g=gameById(p.gid),stt=playerState(c,pid);
  return `<div class="fxr"><span class="fxp">${esc((c.slots&&c.slots[i])||p.pos)}</span><div class="fxn"><b>${esc(p.name)}</b><small>${esc(p.team)} ${esc(p.opp)} · ${stt==='pre'?(g?esc(clockText(g)):'Not started'):stt==='live'?`<span style="color:#ff8080">● ${esc(g?clockText(g):'Live')}</span>`:'Final'}${ps?' · '+esc(ps.line):''}</small></div><div class="fxv"><b>${ps?ps.fp:'–'}</b><small>proj ${p.proj}</small></div></div>`}).join('')}</div>`;
 return `<button class="crumb" data-nav="fantasy">← Fantasy</button>
 <div class="gd"><div class="gdTop"><span>${LG[c.lg].icon} ${LG[c.lg].name} · ${slateLabel(c.date)} · ${T.name}</span><span>${fin?'FINAL':'<i class="dot"></i>LIVE'}</span></div>
 <div class="note">Entry ${fmt(c.fee)} · Pays ${T.pay.map((x,i)=>`${ord(i+1)} ${fmt(x*c.fee)}`).join(' · ')}${fin?` · You won <b>${fmt(c.payout)}</b>`:' · Points update about every 30 seconds while games are live'}</div>
 <div class="fxlb">${rows.map(x=>`<button class="fxlr ${x.e.you?'me':''}" data-fxexp="${x.i}"><span class="rk">${ord(x.rank)}</span><span class="nm">${esc(x.e.name)}${x.e.pers?`<small>${esc(x.e.pers)}</small>`:''}</span><span class="lf">${fin?'':x.left+' left'}</span><b>${x.pts}</b></button>${FXUI.open[c.id+'-'+x.i]||x.e.you?lineup(x.e):''}`).join('')}</div></div>
 <div class="note">Scoring: ${S.rules}</div>`;
}

/* ================= persistence ================= */
const KEY='pacebook_v2';
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:1,now:V.now,real:Date.now(),bal:V.bal,bets:V.bets,nid:V.nid,bonusAt:V.bonusAt,speed:V.speed,fantasy:V.fantasy,
 games:V.games.filter(g=>!g.real||fxPinned().has(g.id)||V.bets.some(b=>b.status==='open'&&b.legs.some(l=>l.gid===g.id))).map(g=>{const o={};for(const k in g){if(k[0]==='_'||k==='sims')continue;o[k]=g[k]}return o})}))}catch(e){}}
const SIMLG={cbb:'ncaam',volleyball:'ncaavb',football:'nfl',basketball:'nba',hockey:'nhl',baseball:'mlb',soccer:'epl',tennis:'atp',mma:'ufc'};
function repairGames(list){
 // saves from the first store build dropped each game's league and real-game info; rebuild them
 const out=[];
 for(const g of list){
  if(!g||!g.s||!g.t)continue;
  if(!g.lg){
   if(String(g.id).startsWith('r-')){const lg=String(g.id).split('-')[1];if(!LG[lg])continue;g.lg=lg;g.real=true;
    g.s=initState(g.sport);g.started=false;g.inited=false;g.finalAt=0;g.rst='pre';g.log=[];g.ln=0;g.prog=0}
   else g.lg=SIMLG[g.sport];
  }
  if(!LG[g.lg])continue;
  out.push(g);
 }
 return out;
}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||d.v!==1)return false;
 Object.assign(V,{now:d.now,bal:d.bal,bets:d.bets||[],games:repairGames(d.games||[]),nid:d.nid,bonusAt:d.bonusAt||0,speed:d.speed||1,fantasy:d.fantasy||[]});
 const away=clamp((Date.now()-d.real)/1000,0,3600);for(let x=0;x<away;x+=5)advance(Math.min(5,away-x));return true}catch(e){return false}}

/* ================= events ================= */
document.addEventListener('click',e=>{
 const T=e.target;let el;
 if(el=T.closest('[data-k]')){toggleSlip(el.dataset.k);return}
 if(el=T.closest('[data-watch-next]')){const n=V.games.find(g=>status(g)==='live'&&(!A||g.id!==A.gid));if(n)openArena(n.id);else toast('No other live games right now');return}
 if(el=T.closest('[data-watch]')){if(el.dataset.watch)openArena(el.dataset.watch);return}
 if(el=T.closest('[data-fxlg]')){FXUI.lg=el.dataset.fxlg;FXUI.date=null;lastMainHTML='';renderMain();return}
 if(el=T.closest('[data-fxdate]')){FXUI.date=el.dataset.fxdate;lastMainHTML='';renderMain();return}
 if(el=T.closest('[data-fxtype]')){FXUI.type=el.dataset.fxtype;lastMainHTML='';renderMain();return}
 if(el=T.closest('[data-fxfee]')){FXUI.fee=+el.dataset.fxfee;lastMainHTML='';renderMain();return}
 if(el=T.closest('[data-fxretry]')){FX.st[FXUI.lg]=null;loadStats(FXUI.lg);return}
 if(el=T.closest('[data-fxbuild]')){FB={lg:FXUI.lg,date:FXUI.date,type:FXUI.type,fee:FXUI.fee,picks:FXSP[FXUI.lg].slots.map(()=>null),pos:'ALL',q:'',sort:'proj'};go('fantasy-build');return}
 if(FB&&(el=T.closest('[data-fxadd]'))){const F=FXSP[FB.lg],p=fxPool(FB.lg,FB.date).find(x=>x.id===el.dataset.fxadd);if(p){const i=FB.picks.findIndex((x,i)=>!x&&F.slots[i][1].includes(p.pos));if(i>=0)FB.picks[i]=p}lastMainHTML='';renderMain();return}
 if(FB&&(el=T.closest('[data-fxrm]'))){FB.picks[+el.dataset.fxrm]=null;lastMainHTML='';renderMain();return}
 if(FB&&(el=T.closest('[data-fxrmid]'))){FB.picks=FB.picks.map(p=>p&&p.id===el.dataset.fxrmid?null:p);lastMainHTML='';renderMain();return}
 if(FB&&T.closest('[data-fxclear]')){FB.picks=FB.picks.map(()=>null);lastMainHTML='';renderMain();return}
 if(FB&&T.closest('[data-fxauto]')){const F=FXSP[FB.lg],pool=fxPool(FB.lg,FB.date),L=optimize(pool,F.slots,F.cap,FB.picks,p=>p.proj);if(L)FB.picks=L;else toast('Your picks leave no room under the cap — remove someone first','warn');lastMainHTML='';renderMain();return}
 if(FB&&T.closest('[data-fxenter]')){enterContest();return}
 if(FB&&(el=T.closest('[data-fxpos]'))){FB.pos=el.dataset.fxpos;lastMainHTML='';renderMain();return}
 if(FB&&(el=T.closest('[data-fxsort]'))){FB.sort=el.dataset.fxsort;lastMainHTML='';renderMain();return}
 if(el=T.closest('[data-fxopen]')){go('fantasy-c-'+el.dataset.fxopen);return}
 if(el=T.closest('[data-fxexp]')){const k=VIEW.slice(10)+'-'+el.dataset.fxexp;FXUI.open[k]=!FXUI.open[k];lastMainHTML='';renderMain();return}
 if(el=T.closest('[data-refresh]')){if(!REAL.loading){toast('Loading the latest real games…');REAL.sched=0;pollReal(true)}return}
 if(el=T.closest('[data-cash]')){cashOut(el.dataset.cash);return}
 if(el=T.closest('[data-rm]')){SLIP.delete(el.dataset.rm);renderSlip();lastMainHTML='';renderMain();renderArenaBets();return}
 if(el=T.closest('[data-qs]')){const it=SLIP.get(el.dataset.qs);if(it){it.stake=String((Math.floor(+it.stake)||0)+(+el.dataset.v));const inp=document.querySelector(`[data-stake="${CSS.escape(it.key)}"]`);if(inp)inp.value=it.stake;slipTotals()}return}
 if(el=T.closest('[data-pq]')){PSTAKE=String((Math.floor(+PSTAKE)||0)+(+el.dataset.pq));$('#pStake').value=PSTAKE;slipTotals();return}
 if(el=T.closest('[data-mode]')){MODE=el.dataset.mode;renderSlip();return}
 if(T.id==='placeBtn'){place();return}
 if(T.id==='slipClr'){SLIP.clear();renderSlip();lastMainHTML='';renderMain();renderArenaBets();return}
 if(T.id==='slipX'){$('#slip').classList.remove('open');return}
 if(el=T.closest('[data-open]')){if(el.dataset.closeArena)closeArena();go('game-'+el.dataset.open);return}
 if(el=T.closest('[data-nav]')){go(el.dataset.nav);return}
});
document.addEventListener('input',e=>{const T=e.target;if(T.dataset.fxq!=null&&FB){FB.q=T.value;lastMainHTML='';renderMain();return}if(T.dataset.stake!=null){const it=SLIP.get(T.dataset.stake);if(it){T.value=T.value.replace(/[^0-9]/g,'');it.stake=T.value;slipTotals()}}else if(T.id==='pStake'){T.value=T.value.replace(/[^0-9]/g,'');PSTAKE=T.value;slipTotals()}});
$('#slipFab').onclick=()=>$('#slip').classList.toggle('open');
$('#aSlip').onclick=()=>$('#slip').classList.toggle('open');
$('#aClose').onclick=closeArena;
$('#aSound').onclick=soundToggle;
$('#aFull').onclick=()=>{const el=document.documentElement;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(el.requestFullscreen)el.requestFullscreen().catch(()=>toast('Fullscreen is blocked here — try the open-in-new-tab view','warn'));else toast('Fullscreen not supported','warn')};
$('#speedSel').onchange=e=>{V.speed=+e.target.value;toast(`Game speed set to ${V.speed}×`)};
$('#bonusBtn').onclick=()=>{const ready=Date.now()-V.bonusAt>2*3600e3,broke=V.bal<50&&!V.bets.some(x=>x.status==='open');if(broke){V.bal+=2500;toast('Account refilled: +2,500 coins','ok')}else if(ready){V.bal+=1000;V.bonusAt=Date.now();toast('+1,000 free coins! Come back in 2 hours for more.','ok')}renderWallet();save()};
addEventListener('keydown',e=>{if(e.key==='Escape'&&A)closeArena()});

/* ================= boot ================= */
if(!load()){initWorld();setTimeout(()=>toast('Welcome! You start with <b>10,000</b> play coins.','ok'),600)}
$('#speedSel').value=String(V.speed);
{const h=location.hash.slice(1);if(h)VIEW=h}
refreshSims(400);render();renderSlip();pollReal();setInterval(pollReal,5000);
let lastT=performance.now(),acc=0,saveAcc=0;
setInterval(()=>{
 const n=performance.now(),dt=Math.min(5,(n-lastT)/1000);lastT=n;
 advance(dt*V.speed);refreshSims(28);
 acc+=dt;saveAcc+=dt;
 if(A)renderArena(false);
 if(acc>=1){acc=0;fantasyTick();ltTick();renderMain();renderNav();renderWallet();updateSlipOdds();slipTotals()}
 if(saveAcc>=5){saveAcc=0;save()}
},250);
addEventListener('beforeunload',save);
</script>

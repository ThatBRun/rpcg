<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1630">
<title>Really Live — RAMPACEGAMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1630;--card:#18224a;--card2:#202d5c;--acc:#ff8a1f;--acc2:#29c4ff;--txt:#eef2ff;--mut:#a9b4d6;--ok:#2fbf62;--bad:#e5484d;--y:#ffd23f}
button,input{font-family:inherit}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Nunito,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;display:block;image-rendering:pixelated}
#ui{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 14px);overflow-y:auto;touch-action:pan-y;z-index:10;background:rgba(9,13,32,.55);backdrop-filter:blur(2px)}
#ui.center{justify-content:center;background:transparent}
.panel{width:100%;max-width:520px;background:linear-gradient(180deg,var(--card2),var(--card));border:2px solid #2d3b78;border-radius:20px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.45);margin:auto 0}
.panel.wide{max-width:760px}
h1,h2,h3,h4{font-family:"Russo One",system-ui,sans-serif;font-weight:400;margin:.2em 0 .5em;letter-spacing:.5px}
h2{font-size:22px}h3{font-size:18px}h4{font-size:15px;color:var(--y);margin-top:14px}
.sub{color:var(--mut);font-size:14px;margin:.3em 0 .8em}
.big{font-size:18px;font-weight:800}
.btn{font:800 15px Nunito,sans-serif;color:var(--txt);background:#2a3874;border:2px solid #3b4c96;border-radius:14px;padding:11px 16px;cursor:pointer;transition:transform .08s,filter .1s;box-shadow:0 4px 0 #141c3d}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #141c3d}
.btn.pri{background:linear-gradient(180deg,#ffa041,#ff7a10);border-color:#ffb46a;color:#1d1200;box-shadow:0 4px 0 #9a4300}
.btn.acc{background:linear-gradient(180deg,#45d2ff,#1aa7e6);border-color:#8fe3ff;color:#04202e;box-shadow:0 4px 0 #0b5c80}
.btn.big{font-size:17px;padding:14px 18px;width:100%}
.btn.small{font-size:13px;padding:7px 10px;border-radius:10px}
.btn.locked{opacity:.45}
.btn:disabled{cursor:default}
.btn.dim{opacity:.3}
.menu{display:flex;flex-direction:column;gap:10px;width:100%}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px}
.title{width:100%;max-width:420px;text-align:center}
.gtitle{font-size:56px;line-height:.95;margin:14px 0 6px;color:#fff;text-shadow:0 4px 0 #1b5fe0,0 8px 0 #0a1a4a}
.gtitle span{color:var(--acc);text-shadow:0 4px 0 #9a4300,0 8px 0 #3d1a00}
.tag{color:var(--mut);margin:6px 0 20px}
.rel{margin-top:16px;color:var(--mut);font-size:12px}
.rplogo{display:inline-flex;align-items:center;gap:10px;font-family:"Russo One",system-ui,sans-serif;font-size:22px;letter-spacing:2px;color:#fff}
.splash{text-align:center;animation:fadein 1s}.splash .rplogo{font-size:30px}.presents{color:var(--mut);margin-top:10px;letter-spacing:6px;text-transform:uppercase;font-size:12px}
@keyframes fadein{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.create label{display:block;font-weight:800;margin:10px 0}
.create input,.gform input{width:100%;margin-top:6px;font:700 16px Nunito,system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid #3b4c96;background:#0f1630;color:#fff;user-select:text;-webkit-user-select:text}
.prevrow{display:flex;justify-content:center;background:radial-gradient(ellipse at center,#2d4a2a,#1a2c18);border-radius:16px;padding:6px;margin-bottom:6px}
#prev{image-rendering:pixelated;max-width:100%}
.opt{margin:10px 0}.opt b{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:10px;border:3px solid #0f1630;cursor:pointer;background:#2a3874;color:#fff;font:700 11px Nunito,system-ui,sans-serif;padding:0}
.sws.txt .sw{width:auto;padding:0 10px}
.sw.sel{outline:3px solid var(--y);outline-offset:1px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{flex:1;font:800 14px Nunito,system-ui,sans-serif;padding:9px 6px;border-radius:12px;border:2px solid #3b4c96;background:#1a2450;color:var(--mut);cursor:pointer;min-width:70px}
.tab.sel{background:var(--acc);color:#1d1200;border-color:#ffb46a}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.scard{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:14px;border:2px solid #2d3b78;background:#141d40;color:var(--txt);cursor:pointer;font-family:Nunito,system-ui,sans-serif}
.scard:active{transform:scale(.98)}
.crest{flex:none;width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:16px "Russo One",system-ui,sans-serif;background:var(--c1);color:var(--c2);border:3px solid var(--c2);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.crest.big{width:74px;height:74px;font-size:22px}
.sinfo b{display:block;font-size:14px}.sinfo small{color:var(--mut);font-size:12px}
.reqs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}.reqs span{font-size:10px;font-weight:800;background:#24305e;padding:2px 6px;border-radius:6px}
.banner{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:linear-gradient(90deg,var(--c1),#141d40);margin-bottom:8px}.banner b{font:18px "Russo One",system-ui,sans-serif;display:block}.banner small{color:#fff;opacity:.85}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-left:4px;border:2px solid #fff}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}.tbl th{color:var(--mut);text-align:left;font-weight:800;padding:4px}.tbl td{padding:5px 4px;border-top:1px solid #2a3770}.tbl tr.me td{color:var(--y);font-weight:800}
.up{color:var(--ok);font-weight:800}.down{color:var(--bad);font-weight:800}
.class .cls-h{display:flex;gap:8px;align-items:center;justify-content:space-between;color:var(--mut);font-weight:800;font-size:13px}
.pill{background:var(--acc2);color:#04202e;padding:3px 10px;border-radius:99px;font-weight:800}
.lesson{background:#101935;border-left:4px solid var(--acc2);padding:12px;border-radius:10px;margin:10px 0;line-height:1.45;font-size:15px}
.qbox{font:800 20px Nunito,system-ui,sans-serif;background:#101935;padding:18px 14px;border-radius:14px;margin:12px 0;line-height:1.35;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opts .btn{min-height:58px;font-size:15px}
.btn.right{background:var(--ok)!important;border-color:#7ef0a4!important;color:#032b12!important}
.btn.wrong{background:var(--bad)!important;border-color:#ff9b9e!important}
.sprow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #2a3770;flex-wrap:wrap}.sprow .ic{font-size:22px}.sprow b{flex:1;min-width:90px}.tiers{display:flex;gap:6px}
.tiers .btn{line-height:1.1}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:14px;border:2px solid #2d3b78;background:#141d40;color:#fff;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer}.sbtn span{font-size:30px}
.gameday{text-align:center}.gameday>span{font:16px "Russo One",system-ui,sans-serif;color:var(--y);letter-spacing:2px}.vs{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0}.vs b{font:26px "Russo One",system-ui,sans-serif}
.shopit{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #2a3770}.shopit .ic{font-size:26px}.shopit div{flex:1}.shopit small{display:block;color:var(--mut)}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:none;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
#hud .hl{background:rgba(12,16,40,.85);border:2px solid #2d3b78;border-radius:14px;padding:6px 12px;font-size:13px;line-height:1.3}#hud .hl span{color:var(--y);font-weight:800}
.phoneBtn{pointer-events:auto;position:relative;font-size:26px;width:52px;height:52px;border-radius:16px;border:2px solid #3b4c96;background:rgba(12,16,40,.9);cursor:pointer}
.phoneBtn i{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font:800 11px Nunito,system-ui,sans-serif;font-style:normal;border-radius:99px;padding:2px 6px}
body:not(.playing) #controls{display:none}
#btnA,#btnB{position:fixed;z-index:6;border-radius:50%;display:flex;align-items:center;justify-content:center;font:16px "Russo One",system-ui,sans-serif;color:#fff;touch-action:none;cursor:pointer;user-select:none;box-shadow:0 5px 0 rgba(0,0,0,.4)}
#btnA{width:84px;height:84px;right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 34px);background:radial-gradient(circle at 35% 30%,#ffb46a,#ff7a10);border:3px solid #ffd2a6}
#btnB{width:62px;height:62px;right:calc(env(safe-area-inset-right) + 114px);bottom:calc(env(safe-area-inset-bottom) + 22px);background:radial-gradient(circle at 35% 30%,#7fe0ff,#1aa7e6);border:3px solid #c3f0ff}
#btnA span,#btnB span{font-size:13px;text-shadow:0 2px 0 rgba(0,0,0,.35);text-align:center;line-height:1}
#btnA.on,#btnB.on{transform:translateY(3px) scale(.96);box-shadow:0 2px 0 rgba(0,0,0,.4)}
#stickBase{position:fixed;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);display:none;z-index:6;pointer-events:none}
#stickKnob{position:absolute;left:30px;top:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid #fff}
.hint{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom) + 40px);color:rgba(255,255,255,.45);font:800 12px Nunito,sans-serif;z-index:4;pointer-events:none}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,8,20,.65);z-index:30;padding:16px}
.mcard{width:100%;max-width:440px;max-height:88vh;overflow:auto;touch-action:pan-y;background:linear-gradient(180deg,var(--card2),var(--card));border:2px solid #3b4c96;border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:fadein .2s}
.mbody{font-size:15px;line-height:1.45}.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
#toast{position:fixed;left:50%;top:80px;transform:translate(-50%,-20px);opacity:0;background:#0b1029;border:2px solid var(--y);color:var(--y);padding:8px 16px;border-radius:99px;font-weight:800;z-index:40;transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#phone{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;background:rgba(5,8,20,.6);padding:12px}
.phone{width:100%;max-width:360px;height:min(92vh,720px);background:#0a0d1a;border:10px solid #1a1d29;border-radius:42px;box-shadow:0 0 0 2px #444a5c,0 30px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;overflow:hidden;animation:fadein .2s}
.pbar{display:flex;justify-content:space-between;padding:10px 18px 6px;font-size:12px;font-weight:800;color:#cfd6e6}
.pscreen{flex:1;overflow-y:auto;padding:8px 14px;touch-action:pan-y;background:linear-gradient(180deg,#1b2650,#0f1630)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:18px 4px}
.papp{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;font:700 11px Nunito,system-ui,sans-serif;cursor:pointer}
.papp div{position:relative;width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.papp i{position:absolute;top:-6px;right:-6px;background:var(--bad);font:800 11px Nunito,system-ui,sans-serif;font-style:normal;border-radius:99px;padding:2px 6px}
.pwidget{background:rgba(255,255,255,.08);border-radius:16px;padding:12px;font-size:12px;line-height:1.5;margin-top:6px}
.pnav{display:flex;justify-content:space-around;padding:10px;background:#11152a}.pnav button{background:none;border:none;color:#fff;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;padding:6px 14px}
.news{padding:8px 0;border-top:1px solid #2a3770;font-size:13px}.news small{color:var(--mut)}
.sched{font-size:13px;padding:5px 8px;border-radius:8px;margin:3px 0;background:#141d40}.sched.w{border-left:4px solid var(--ok)}.sched.l{border-left:4px solid var(--bad)}
.bubble{background:#1e7a43;border-radius:16px 16px 16px 4px;padding:10px 12px;margin:8px 0;font-size:13px;line-height:1.4}.bubble small{opacity:.7}
.track{display:flex;justify-content:space-between;width:100%;margin:6px 0;text-align:left}.track small{opacity:.7}
.gougle{font-size:30px;text-align:center;margin:10px 0}
.gform{display:flex;gap:6px;align-items:center}.gform input{margin:0}
.gr{background:#141d40;border-radius:10px;padding:10px;margin:8px 0;font-size:13px;line-height:1.4}.gr small{color:var(--mut)}

img.logo{display:inline-block;vertical-align:middle;image-rendering:auto;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.search{width:100%;margin:4px 0 10px;font:700 15px Nunito,system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid #3b4c96;background:#0f1630;color:#fff;user-select:text;-webkit-user-select:text}
em{font-style:normal;font-size:10px;font-weight:800;background:#ff8a1f;color:#1d1200;padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:middle}
.sbtn em{margin:0}
.tab.small{font-size:12px;min-width:56px;padding:6px 4px}
.center{text-align:center}
.banner{background:linear-gradient(90deg,#26336b,#141d40)}
.vs img.logo{width:64px;height:64px}
#ui.center.scroll{justify-content:center}
@media (max-height:520px){
  .gtitle{font-size:34px;margin:4px 0}.tag{margin:2px 0 8px;font-size:13px}.title{max-width:640px}
  .title .menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.title .menu .row2{grid-column:span 2}
  .btn.big{padding:10px 14px;font-size:15px}.rplogo{font-size:16px}.rplogo svg{width:30px;height:30px}
  .panel{padding:12px;margin:0}#ui{padding-top:8px}
  .opts{grid-template-columns:1fr 1fr 1fr 1fr}.opts .btn{min-height:46px}.qbox{padding:10px;font-size:17px;margin:6px 0}.lesson{padding:8px;font-size:14px}
  .phone{height:94vh;max-width:520px;border-width:6px;border-radius:26px}.pgrid{grid-template-columns:repeat(4,1fr);gap:10px}
  #btnA{width:72px;height:72px;bottom:18px}#btnB{width:56px;height:56px;right:100px;bottom:14px}
  .hint{bottom:18px}
  .mcard{max-height:94vh;padding:12px}
}


#achToast{position:fixed;left:50%;top:120px;transform:translate(-50%,-30px);opacity:0;background:linear-gradient(90deg,#3a2a00,#6b4e00);border:2px solid #ffd23f;color:#fff;padding:10px 18px;border-radius:16px;z-index:41;transition:.3s;pointer-events:none;text-align:center;min-width:220px}
#achToast b{display:block;color:#ffd23f;font:16px "Russo One",system-ui,sans-serif}#achToast small{opacity:.85}
#achToast.show{opacity:1;transform:translate(-50%,0)}
#pauseBtn{display:none;position:fixed;left:10px;top:calc(env(safe-area-inset-top) + 64px);z-index:7;width:42px;height:42px;border-radius:12px;border:2px solid #3b4c96;background:rgba(12,16,40,.9);color:#fff;font-size:18px;cursor:pointer}
body.sporting.playing #pauseBtn{display:block}
.emoteBtn{margin-left:6px;font-size:22px}
#hud{gap:0}#hud .phoneBtn:first-of-type{margin-left:auto}
body.lefty #btnA{right:auto;left:calc(env(safe-area-inset-left) + 18px)}body.lefty #btnB{right:auto;left:calc(env(safe-area-inset-left) + 114px)}body.lefty .hint{left:auto;right:18px}
body.bigbtn #btnA{transform:scale(1.25);transform-origin:bottom right}body.bigbtn #btnB{transform:scale(1.25);transform-origin:bottom right}
.xpbar{height:10px;background:#101935;border-radius:99px;overflow:hidden;margin-bottom:8px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#29c4ff,#7c4dff)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calgrid b{font-size:11px;color:var(--mut)}
.cal{background:#141d40;border-radius:8px;min-height:38px;font-size:15px;padding:2px}.cal small{display:block;font-size:10px;color:var(--mut)}.cal.today{outline:2px solid var(--y)}.cal.w{background:#14532d}.cal.l{background:#5b1a1d}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.card{width:96px;background:linear-gradient(180deg,#2a3874,#141d40);border:2px solid #ffd23f;border-radius:10px;padding:6px;text-align:center;font-size:11px}.card b{display:block;font-size:11px}.card small{display:block;color:var(--mut);font-size:10px}
.flist{columns:2;font-size:13px;padding-left:22px;margin:0}@media (max-width:420px){.flist{columns:1}}
.news.dim{opacity:.5}.slider{display:flex;align-items:center;gap:10px;font-weight:800}.slider input{flex:1}
.tabs.slots{margin:0}
.bubble.post{background:#2a1f4a}
.pscreen{background:var(--wall,linear-gradient(180deg,#1b2650,#0f1630))}

@media (max-width:420px){.gtitle{font-size:46px}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="controls"><div id="stickBase"><div id="stickKnob"></div></div><div class="hint">◀ drag to move</div><div id="btnB"><span>B</span></div><div id="btnA"><span>A</span></div></div>

<script>

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

function srng(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }

function genPlace(r){
  for(let k=0;k<200;k++){
    let n; const m=r();
    if(m<.55){ const a=NP[Math.floor(r()*NP.length)], b=NS[Math.floor(r()*NS.length)]; if(a.toLowerCase().endsWith(b[0])) continue; n=a+b; }
    else { n=NP[Math.floor(r()*NP.length)]+' '+NT[Math.floor(r()*NT.length)]; }
    if(!USED_NAMES.has(n)){ USED_NAMES.add(n); return n; }
  }
  return 'New '+Math.floor(r()*99999);
}
// 6 divisions per level, conferences of 6 teams
const DIV_COUNT=6;
const CONF_PER_DIV={es:4,ms:4,hs:5};
(function genSchools(){
  const suffix={es:' Elementary',ms:' Middle',hs:' High'};
  const reqBase={es:[1.5,2.0,2.5],ms:[2.0,2.3,2.5],hs:[2.2,2.5,2.8]};
  for(const lv of ['es','ms','hs']){
    const r=srng(hashStr('schools-'+lv));
    const need=DIV_COUNT*CONF_PER_DIV[lv]*6 - SCHOOLS[lv].length;
    for(let i=0;i<need;i++){
      const name=genPlace(r)+suffix[lv]; const b=reqBase[lv]; const j=()=>Math.round((r()*.3-.1)*10)/10;
      const t0=Math.max(1.0,Math.round((b[0]+j())*10)/10), t1=Math.round(Math.max(t0+.1,b[1]+j())*10)/10, t2=Math.round(Math.max(t1+.1,b[2]+j())*10)/10;
      SCHOOLS[lv].push([name,t0,t1,t2]);
    }
  }
})();
const NEW_SCHOOL_COUNT = SCHOOLS.es.length+SCHOOLS.ms.length+SCHOOLS.hs.length-54;
// divisions[level] = [ [conf, conf, ...] x6 ], conf = [6 names]
const DIVISIONS={};
(function buildDivs(){
  for(const lv of ['es','ms','hs']){
    const names=SCHOOLS[lv].map(s=>s[0]);
    const firstConfs = lv==='hs'? HS_DIVISIONS : [names.slice(0,6),names.slice(6,12),names.slice(12,18)];
    const rest=names.filter(n=>!firstConfs.flat().includes(n));
    const divs=[];
    for(let d=0;d<DIV_COUNT;d++){ const confs=[]; for(let c=0;c<CONF_PER_DIV[lv];c++){ if(d<3&&c===0) confs.push(firstConfs[d]); else confs.push(rest.splice(0,6)); } divs.push(confs); }
    DIVISIONS[lv]=divs;
  }
})();

const TEAM_INFO_CACHE=new Map();
function findSchool(name){
  for(const lv of ['es','ms','hs']){ const s=SCHOOLS[lv].find(x=>x[0]===name); if(s){ const div=DIVISIONS[lv].findIndex(d=>d.some(c=>c.includes(name))); const conf=DIVISIONS[lv][div].findIndex(c=>c.includes(name)); return { level:lv, name, req:[s[1],s[2],s[3]], div, conf }; } }
  for(const d of COLLEGE_DIVS){ const i=COLLEGES[d.id].indexOf(name); if(i>=0) return { level:'col', name, cdiv:d.id, req:[d.gpa], div:COLLEGE_DIVS.indexOf(d), conf:Math.floor(i/10) }; }
  return null;
}
function schoolInfo(name){
  if(TEAM_INFO_CACHE.has(name)) return TEAM_INFO_CACHE.get(name);
  const h=hashStr(name);
  const col=SCHOOL_COLORS[h%SCHOOL_COLORS.length];
  let mascot=MASCOTS[(h>>>5)%MASCOTS.length];
  const isPro=PRO_NICK.some(n=>name.endsWith(' '+n));
  if(isPro) mascot=name.split(' ').pop();
  const words=name.replace(/^(University of|College of) /,'').replace(/ (Elementary|Middle|High|University|College|State|Community|Junior|Technical|County|Christian|Baptist|Wesleyan|Institute.*|Tech|Polytechnic|Liberal Arts)/g,'').split(' ').filter(Boolean);
  let abbr = words.length>1? words.map(w=>w[0]).join('').slice(0,3) : words[0].slice(0,3);
  if(/State/.test(name)) abbr=(abbr.slice(0,2)+'S');
  abbr=abbr.toUpperCase();
  const fs=findSchool(name);
  let rating=45+((h>>>9)%40);
  if(fs&&fs.level==='col'){ const d=COLLEGE_DIVS.find(x=>x.id===fs.cdiv); rating=d.rating[0]+((h>>>9)%(d.rating[1]-d.rating[0])); }
  if(isPro) rating=82+((h>>>9)%16);
  const info={ name, mascot, c1:col[0], c2:col[1], abbr, rating };
  TEAM_INFO_CACHE.set(name,info); return info;
}
function teamLevelLabel(name){ const f=findSchool(name); if(!f) return 'Pro'; if(f.level==='col') return COLLEGE_DIVS.find(d=>d.id===f.cdiv).name; return LEVELS[f.level].name+' · Division '+(f.div+1); }

function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function hexToRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function shade(hex,f){ const [r,g,b]=hexToRgb(hex); return f>=0? rgbToHex(r+(255-r)*f,g+(255-g)*f,b+(255-b)*f) : rgbToHex(r*(1+f),g*(1+f),b*(1+f)); }
function seeded(seed){ let s=seed>>>0||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }

const FW=18, FH=26;
function drawCharFrame(ctx, look, dir, f){
  // dir: 0 down,1 left,3 up (right is mirrored left)
  const P=(x,y,w,h,c)=>{ ctx.fillStyle=c; ctx.fillRect(x+1,y+1,w,h); };
  const sk=look.skin, skD=shade(sk,-.18), hr=look.hair, hrD=shade(hr,-.3), hrL=shade(hr,.25);
  const sh=look.shirt, shD=shade(sh,-.25), shL=shade(sh,.2), acc=look.accent||shade(sh,.5);
  const pa=look.pants, paD=shade(pa,-.3), so=look.shoes||'#f2f2f2', soD=shade(so,-.35);
  const st=look.hairStyle||'short';
  const step = f===1?1 : f===2?-1 : 0;

  if(dir===0||dir===3){
    // legs
    const lUp = step===1?1:0, rUp = step===-1?1:0;
    P(5,17,6,2,pa); P(5,18,1,1,paD);
    P(5,19-lUp,3,2,pa); P(8,19-rUp,3,2,pa); P(7,19,1,2,paD);
    P(5,21-lUp,3,1,so); P(8,21-rUp,3,1,so); P(5,22-lUp,3,1,soD); P(8,22-rUp,3,1,soD);
    // arms (swing)
    const la = step, ra = -step;
    P(2,11+la,2,3,sh); P(2,14+la,2,3,sk); P(2,16+la,2,1,skD);
    P(12,11+ra,2,3,shD); P(12,14+ra,2,3,sk); P(12,16+ra,2,1,skD);
    // torso
    P(4,11,8,6,sh); P(4,11,2,6,shL); P(10,11,2,6,shD); P(4,16,8,1,shD);
    if(dir===0){ P(6,11,4,1,acc); P(7,12,2,1,acc); }
    else { P(5,11,6,1,acc); }
    P(3,11,1,2,acc); P(12,11,1,2,acc);
    if(look.num!=null && dir===3){ drawDigits(P, look.num, acc); }
    // head
    if(dir===0){
      P(4,3,8,8,sk); P(4,9,8,1,skD); P(3,6,1,2,sk); P(12,6,1,2,sk);
      P(6,6,1,2,'#1a1a22'); P(9,6,1,2,'#1a1a22'); P(6,6,1,1,'#ffffff');P(9,6,1,1,'#ffffff');
      P(5,8,1,1,shade(sk,-.08)); P(10,8,1,1,shade(sk,-.08)); P(7,9,2,1,shade(sk,-.3));
      drawHairFront(P,st,hr,hrD,hrL);
    } else {
      P(4,3,8,8,sk); P(3,6,1,2,sk); P(12,6,1,2,sk);
      drawHairBack(P,st,hr,hrD,hrL);
    }
    if(look.helmet) drawHelmet(P, dir, look.helmet); else drawAcc(P,dir,look);
  } else {
    // side view, facing left
    const strideA = step===0?0:3;
    if(step===0){ P(6,17,4,4,pa); P(6,17,1,4,paD); P(5,21,5,1,so); P(5,22,5,1,soD); }
    else {
      const back = step===1? 'b':'a';
      // back leg (darker)
      P(8+ (step===1?1:0),17,3,3,paD); P(8+(step===1?1:0),20,3,1,soD); P(8+(step===1?1:0),21,3,1,shade(so,-.5));
      // front leg
      P(4,17,3,4,pa); P(3,21,4,1,so); P(3,22,4,1,soD);
      P(6,17,3,2,pa);
    }
    // torso

function outlinePass(ctx,w,h){
  const img=ctx.getImageData(0,0,w,h), d=img.data, out=new Uint8Array(w*h);
  const [orr,og,ob]=hexToRgb(OUTLINE);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4; if(d[i+3]) continue;
    const fx=x%FW, fy=y%FH;
    const n=(xx,yy)=>{ if(xx<0||yy<0||xx>=w||yy>=h) return 0; if(Math.floor(xx/FW)!==Math.floor(x/FW)||Math.floor(yy/FH)!==Math.floor(y/FH)) return 0; return d[(yy*w+xx)*4+3]; };
    if(n(x-1,y)||n(x+1,y)||n(x,y-1)||n(x,y+1)) out[y*w+x]=1;
  }
  for(let k=0;k<w*h;k++) if(out[k]){ d[k*4]=orr; d[k*4+1]=og; d[k*4+2]=ob; d[k*4+3]=255; }
  ctx.putImageData(img,0,0);
}
const spriteCache=new Map();
function charSheet(look){
  const key=JSON.stringify(look);
  if(spriteCache.has(key)) return spriteCache.get(key);
  const c=mkCanvas(FW*3,FH*4), ctx=c.getContext('2d');
  const tmp=mkCanvas(FW,FH), tctx=tmp.getContext('2d');
  for(let f=0;f<3;f++){
    // row0 down,row1 left,row2 right,row3 up
    ctx.save(); ctx.translate(f*FW,0); drawCharFrame(ctx,look,0,f); ctx.restore();
    ctx.save(); ctx.translate(f*FW,FH); drawCharFrame(ctx,look,1,f); ctx.restore();
    tctx.clearRect(0,0,FW,FH); drawCharFrame(tctx,look,1,f);
    ctx.save(); ctx.translate(f*FW+FW,FH*2); ctx.scale(-1,1); ctx.drawImage(tmp,0,0); ctx.restore();
    ctx.save(); ctx.translate(f*FW,FH*3); drawCharFrame(ctx,look,3,f); ctx.restore();
  }
  outlinePass(ctx,c.width,c.height);
  spriteCache.set(key,c);
  return c;
}
// draw character with feet at (x,y). dir 0 down 1 left 2 right 3 up
function drawChar(ctx, look, x, y, dir, frame, scale=2, extra){
  const sh=charSheet(look);

  ctx.beginPath(); ctx.ellipse(x, y-2, 7*scale/2*1.25, 2.6*scale/2*1.25, 0, 0, Math.PI*2); ctx.fill();
  const lift = extra&&extra.lift||0;
  ctx.drawImage(sh, frame*FW, dir*FH, FW, FH, Math.round(x-FW*scale/2), Math.round(y-(FH-1)*scale-lift), FW*scale, FH*scale);
}

  const r=seeded(seed);

}
function dirFromVec(dx,dy,cur){
  if(Math.abs(dx)<0.01&&Math.abs(dy)<0.01) return cur;
  if(Math.abs(dx)>Math.abs(dy)) return dx<0?1:2;
  return dy<0?3:0;

const Input={ mx:0,my:0, a:false,b:false, aHeld:false,bHeld:false, keys:{}, stick:null, tap:null };

const stickBase=document.getElementById('stickBase'), stickKnob=document.getElementById('stickKnob');
cv.addEventListener('pointerdown',e=>{
  if(!document.body.classList.contains('playing')) return;
  e.preventDefault();
  if((SETTINGS.lefty? e.clientX > W*0.4 : e.clientX < W*0.6) || e.pointerType==='mouse'){
    if(Input.stick) return;
    Input.stick={id:e.pointerId, ox:e.clientX, oy:e.clientY, x:e.clientX, y:e.clientY};
    stickBase.style.display='block'; stickBase.style.left=(e.clientX-55)+'px'; stickBase.style.top=(e.clientY-55)+'px';
    stickKnob.style.transform='translate(0px,0px)';
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  }
  Input.tap={x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  const s=Input.stick; if(!s||s.id!==e.pointerId) return;
  s.x=e.clientX; s.y=e.clientY;
  let dx=s.x-s.ox, dy=s.y-s.oy; const d=Math.hypot(dx,dy), R=48;
  if(d>R){ dx=dx/d*R; dy=dy/d*R; }
  stickKnob.style.transform=`translate(${dx}px,${dy}px)`;
  Input.mx=dx/R; Input.my=dy/R;
});
function endStick(e){ const s=Input.stick; if(!s||s.id!==e.pointerId) return; Input.stick=null; Input.mx=0; Input.my=0; stickBase.style.display='none'; }

function keyVec(){
  if(Input.stick) return;

  if(K['arrowleft']||K['a']) x-=1; if(K['arrowright']||K['d']) x+=1;
  if(K['arrowup']||K['w']) y-=1; if(K['arrowdown']||K['s']) y+=1;

  else if(shape==='shield'){ g.moveTo(s*.1,s*.08); g.lineTo(s*.9,s*.08); g.lineTo(s*.9,s*.5); g.quadraticCurveTo(s*.88,s*.82,c,s*.95); g.quadraticCurveTo(s*.12,s*.82,s*.1,s*.5); g.closePath(); }

function drawEmblem(g,type,x,y,r,col,dark){

function logoCanvas(name,size=64){
  const key=name+'|'+size; if(LOGO_CACHE.has(key)) return LOGO_CACHE.get(key);

  const c=mkCanvas(s,s), g=c.getContext('2d');
  const shape=['shield','circle','diamond','hex','badge','pennant'][h%6];
  const dark=shade(inf.c1,-.55);
  g.save(); shapePath(g,shape,s); g.fillStyle=dark; g.fill(); g.restore();
  g.save(); g.translate(s*.06,s*.06); g.scale(.88,.88); shapePath(g,shape,s); g.fillStyle=inf.c2; g.fill(); g.restore();
  g.save(); g.translate(s*.12,s*.12); g.scale(.76,.76); shapePath(g,shape,s); g.fillStyle=inf.c1; g.fill(); g.clip();
  const pat=(h>>>3)%4; g.fillStyle=shade(inf.c1,.18);
  if(pat===0){ g.beginPath(); g.moveTo(0,s*.62); g.lineTo(s/2,s*.38); g.lineTo(s,s*.62); g.lineTo(s,s*.78); g.lineTo(s/2,s*.54); g.lineTo(0,s*.78); g.fill(); }
  if(pat===1){ for(let i=-s;i<s*2;i+=s*.22){ g.fillRect(i,0,s*.08,s); } }
  if(pat===2){ g.fillRect(0,s*.42,s,s*.16); }
  g.restore();
  const em=emblemFor(inf.mascot);
  drawEmblem(g,em,s/2,s*.4,s*.2,inf.c2,dark);

  LOGO_CACHE.set(key,c); return c;
}

class WorldScene{
  constructor(M){

    setButtons(this.near?(this.near.type==='door'?'Enter':'Talk'):'A','Run');

    if(!busy&&Input.a&&this.near) this.interact(this.near);
    const z=this.zoom();
    this.cam.x=Math.max(0,Math.min(this.M.w-W/z,p.x-W/z/2)); this.cam.y=Math.max(0,Math.min(this.M.h-H/z,p.y-H/z/2-10));

  }
}

  if(rf){ if(rf.type==='points'){ const T=rf.to, l=ri(0,Math.max(0,T-2)); return aWins?{a:T,b:l,winA:true}:{a:l,b:T,winA:false}; } const need=Math.ceil(rf.best/2), l=ri(0,need-1); return aWins?{a:need,b:l,winA:true}:{a:l,b:need,winA:false}; }
  let x=SIMS[sport](), y=SIMS[sport](); let g=0; while(x===y&&g++<20) y=SIMS[sport](); if(x===y) y=x+1;
  const hi=Math.max(x,y), lo=Math.min(x,y);
  const winS=low?lo:hi, loseS=low?hi:lo;
  return aWins?{a:winS,b:loseS,winA:true}:{a:loseS,b:winS,winA:false};
}
function didWin(sport,us,them){ return sportById(sport).lowWins? us<them : us>them; }
function recordResult(home,away,r,sport){
  const st=S().season.standings;
  if(st[home]&&st[away]){ st[home].pf+=r.a; st[home].pa+=r.b; st[away].pf+=r.b; st[away].pa+=r.a; if(r.winA){ st[home].w++; st[away].l++; } else { st[away].w++; st[home].l++; } }
  const w=r.winA?home:away, l=r.winA?away:home, ws=r.winA?r.a:r.b, ls=r.winA?r.b:r.a;
  news(`${w} ${pick(['beat','edged','outlasted','topped','rolled past','held off'])} ${l} ${ws}-${ls} (${sportById(sport).name})`);
}
function simOtherGames(round){
  const se=S().season, me=se.conf.indexOf(S().team);
  for(const [x,y] of rrPairs(se.conf.length,round)){ if(x===me||y===me) continue; const a=se.conf[x], b=se.conf[y]; recordResult(a,b,simGame(se.sport,teamRating(a),teamRating(b)),se.sport); }
}
function sortedStandings(){ const st=S().season.standings, low=sportById(S().season.sport).lowWins; return Object.keys(st).sort((a,b)=>(st[b].w-st[a].w)||((st[b].pf-st[b].pa)-(st[a].pf-st[a].pa))*(low?-1:1)); }
function todayGame(){
  const s=S(), se=s.season; if(!se||se.done) return null;
  const g=se.schedule.find(g=>g.day===s.day&&!g.res); if(g) return {kind:'reg',g,opp:g.opp};
  const p=se.playoffs.find(p=>p.day===s.day&&!p.res); if(p) return {kind:p.kind,g:p,opp:p.opp};
  return null;
}
function isMidtermDay(){ const s=S(), se=s.season; return !!se&&!se.done&&!se.midterm&&s.day>=se.midDay&&isSchoolDay(s.day); }
const ROUND_NAME={semi:'Semifinal',cfinal:'Conference Final',title:''};
function roundLabel(k){ return k==='title'?titleName():k==='cfinal'&&S().level==='pro'?'Division Final':ROUND_NAME[k]; }
function applyGameResult(info,us,them){
  const s=S(), se=s.season, sport=se.sport, win=didWin(sport,us,them);
  info.g.res={us,them,win}; s.record[win?'w':'l']++;
  se.stats=se.stats||{w:0,l:0}; se.stats[win?'w':'l']++;
  if(info.kind==='reg'){
    recordResult(s.team,info.opp,{a:us,b:them,winA:win},sport); simOtherGames(info.g.round);
    if(info.g.round===se.schedule.length-1) setupPlayoffs();
  } else {
    news(`${roundLabel(info.kind).toUpperCase()}: ${win?s.team:info.opp} win ${Math.max(us,them)}-${Math.min(us,them)} over ${win?info.opp:s.team}.`);
    if(!win){ se.champion=info.kind==='title'?info.opp:'(eliminated)'; endSeason(`Season over — ${roundLabel(info.kind)} loss to ${info.opp}.`); }
    else if(info.kind==='semi'){ const o=se.semiOther; const r=simGame(sport,teamRating(o[0]),teamRating(o[1])); const ow=r.winA?o[0]:o[1]; se.playoffs.push({kind:'cfinal',day:se.pDays[1],opp:ow,res:null}); msg(coachName(),`On to the ${roundLabel('cfinal')}! Day ${se.pDays[1]} vs ${ow}.`); }
    else if(info.kind==='cfinal'){ s.trophies.push(`${sportById(sport).name} ${se.confLabel} Champions — ${s.team}`); const cf=confFor(s.team,sport); const oc=pick(cf.others); const opp=oc[ri(0,oc.length-1)]; se.playoffs.push({kind:'title',day:se.pDays[2],opp,res:null}); news(`${s.team} win the ${se.confLabel} title and advance to the ${titleName()}!`); msg(coachName(),`CONFERENCE CHAMPS! Next: the ${titleName()} on Day ${se.pDays[2]} vs ${opp}.`); }
    else if(info.kind==='title'){ se.champion=s.team; s.champs++; s.trophies.push(`🏆 ${titleName()} — ${sportById(sport).name} — ${s.team} (Season ${s.seasonNo})`); money(s.level==='pro'?2000:250);
      news(`🏆 ${s.team} WIN THE ${titleName().toUpperCase()}! ${s.name} leads the way.`); msg(coachName(),`CHAMPIONS!!! What a season, ${s.name}.`); endSeason('CHAMPIONS! 🏆'); }
  }

  if(win&&Math.random()<.25){ const k=pick(['spd','skill','power']); if(s.stats[k]<10){ s.stats[k]++; msg(coachName(),`Great game! Your ${({spd:'Speed',skill:'Skill',power:'Power'})[k]} went up to ${s.stats[k]}.`); } }
  save(); return win;
}
function setupPlayoffs(){

function endSeason(text){ const se=S().season; se.done=true; se.endText=text; generateOffers(); }
function checkEligibility(){
  const s=S(), se=s.season; if(!se) return;
  const req=s.level==='col'? [COLLEGE_DIVS.find(d=>d.id===s.cdiv).gpa] : findSchool(s.team).req, g=gpa();

// ---------- RECRUITING ----------
function recruitStars(){
  const s=S(); const st=s.stats; let pts=(st.spd+st.skill+st.power)/3*0.45;
  pts+= Math.min(2,(s.record.w-s.record.l)*0.08) + s.champs*0.8 + Math.max(0,gpa()-2)*0.6 + (s.trophies.length*0.25);
  return Math.max(1,Math.min(5,Math.round(pts)));
}
function generateOffers(){
  const s=S(); if(!(s.level==='hs'||(s.level==='col'&&s.cdiv==='jcc'))) return;
  const stars=recruitStars(), sp=s.season.sport;
  const pool=COLLEGE_DIVS.filter(d=>d.stars<=stars+0&&!(s.level==='col'&&d.id==='jcc'));
  const n=Math.min(6,1+stars+ri(0,1)), out=[];
  for(let i=0;i<n;i++){ const d=pool.length?pick(pool):COLLEGE_DIVS[4]; const c=pick(COLLEGES[d.id]); if(out.some(o=>o.college===c)) continue; out.push({college:c,div:d.id,sport:sp,scholarship:d.id!=='ridge'&&Math.random()<.6+stars*.06,day:s.day}); }
  s.offers=[...out,...s.offers].slice(0,12);
  msg('Recruiting',`You're rated ${'★'.repeat(stars)}${'☆'.repeat(5-stars)}. ${out.length} new college offer${out.length===1?'':'s'}! Open the Recruit app on your phone.`);
}

// ---------- DAY CYCLE ----------
async function sleep(){
  const s=S();
  if(isSchoolDay(s.day)&&!s.attended&&s.level!=='pro'){ for(const k of SUBJECTS) s.grades[k]=Math.max(40,s.grades[k]-4); msg('Principal',`${s.name} was marked absent today. Missing class lowers your grades.`); }
  const tg=todayGame();
  if(tg){ const r=simGame(s.season.sport,teamRating(s.team)-12,teamRating(tg.opp)); msg(coachName(),`Where were you?! We played ${tg.opp} without you.`); applyGameResult(tg,r.a,r.b); }
  if(s.season&&s.season.benched&&s.level!=='pro'){ const req=s.level==='col'?COLLEGE_DIVS.find(d=>d.id===s.cdiv).gpa:findSchool(s.team).req[0]; if(gpa()>=req){ s.season.benched=false; s.season.tier=0; msg(coachName(),`GPA is back to ${gpa().toFixed(2)} — you're eligible again!`); } }
  s.day++; s.phase=isSchoolDay(s.day)?'morning':'afternoon'; s.attended=false; s.practiced=false; s.daily={}; money(s.level==='pro'?0:15);
  if(s.season&&s.season.done&&!s.season.recapShown){ s.season.recapShown=true; save(); await seasonRecap(); return 'recap'; }
  save();
  const tg2=todayGame(); let extra='';
  if(isMidtermDay()) extra+='📝 MIDTERM TESTS today!<br>';
  if(tg2) extra+=`${sportById(s.season.sport).icon} Game today vs <b>${esc(tg2.opp)}</b>${tg2.kind!=='reg'?' ('+roundLabel(tg2.kind)+')':''}<br>`;

  await modal('Good morning! ☀️',`<div class="big">Day ${s.day} · ${DOW[dow(s.day)]}</div><p>${s.level==='pro'?'':'+$15 allowance'}</p><p>${extra}</p>`,[["Let's go",'pri']]);

}

// ---------- CLASSES ----------
function makeQuestion(subject,topic){
  if(subject==='Math'){ const [q,a]=topic[2](); const ws=new Set(); let tries=0; while(ws.size<3&&tries++<60){ const d=pick([-3,-2,-1,1,2,3,5,10,-10,4]); const w=Math.round((a+d*(Math.abs(a)>20?Math.ceil(Math.abs(a)/20):1))*100)/100; if(w!==a) ws.add(w);} return {q,a:String(a),opts:shuffle([String(a),...[...ws].map(String)])}; }
  const raw=pick(topic[2]).split('|'); return {q:raw[0],a:raw[1],opts:shuffle(raw.slice(1))};
}
function topicsFor(level,subject){ return subject==='Math'?MATH_TOPICS[level]:BANK[level][subject]; }
async function runClasses(midterm){
  const s=S(), lv=s.level; hideUI(); setPlaying(false); const results=[];
  for(const subj of SUBJECTS){
    const topics=topicsFor(lv,subj), topic=pick(topics), testName=midterm?pick(TEST_NAMES[lv][subj]):null, n=midterm?6:ri(3,5);
    await new Promise(res=>{ showUI(`<div class="panel class"><div class="cls-h"><span class="pill">${midterm?'MIDTERM':(lv==='col'?'Lecture ':'Period ')+(SUBJECTS.indexOf(subj)+1)}</span><span>${subj}</span></div>
        <h2>${midterm?esc(testName):'Today: '+esc(topic[0])}</h2>
        ${midterm?`<p class="sub">Review:</p>`+topics.map(t=>`<div class="lesson"><b>${esc(t[0])}</b><br>${esc(t[1])}</div>`).join(''):`<div class="lesson">📘 ${esc(topic[1])}</div>`}
        <p class="sub">${n} questions. Miss 2 or more and your ${subj} grade goes down.</p><button class="btn pri big" ${A(res)}>I'm ready</button></div>`,'scroll'); });
    let wrong=0;
    for(let i=0;i<n;i++){ const tp=midterm?pick(topics):topic; const q=makeQuestion(subj,tp); if(!(await askQuestion(subj,i,n,q,midterm?testName:topic[0]))) wrong++; }
    let delta;
    if(midterm){ const pct=(n-wrong)/n*100, old=s.grades[subj]; s.grades[subj]=Math.round(old*.6+pct*.4); delta=s.grades[subj]-old; }
    else { delta=wrong>=2?-5:wrong===1?1:3; s.grades[subj]=Math.max(40,Math.min(100,s.grades[subj]+delta)); if(wrong===0) money(5); }
    results.push({subj,wrong,n,delta});
  }
  s.attended=true; if(s.phase==='morning') s.phase='afternoon'; if(midterm) s.season.midterm=true;
  const rows=results.map(r=>`<tr><td>${r.subj}</td><td>${r.n-r.wrong}/${r.n}</td><td class="${r.delta>=0?'up':'down'}">${r.delta>=0?'+':''}${r.delta}</td><td>${s.grades[r.subj]} ${letter(s.grades[r.subj])}</td></tr>`).join('');
  await new Promise(res=>{ showUI(`<div class="panel"><h2>${midterm?'Midterm Report Card':'Classes done!'}</h2><table class="tbl"><tr><th>Class</th><th>Score</th><th>±</th><th>Grade</th></tr>${rows}</table><p class="big">GPA: ${gpa().toFixed(2)}</p><button class="btn pri big" ${A(res)}>Continue</button></div>`,'scroll'); });
  if(midterm) checkEligibility(); save(); hideUI(); resumeScene();
}
function askQuestion(subj,i,n,q,topicName){
  return new Promise(res=>{
    const s=S(); let hinted=false;
    showUI(`<div class="panel class"><div class="cls-h"><span class="pill">${subj}</span><span>${esc(topicName)}</span><span>Q${i+1}/${n}</span></div>
        <div class="qbox">${esc(q.q)}</div><div class="opts">${q.opts.map(o=>`<button class="btn opt" data-o="${esc(o)}" ${A((e,t)=>answer(o,t))}>${esc(o)}</button>`).join('')}</div>
        ${s.hints>0?`<button class="btn small" ${A(()=>hint())}>📗 Study Guide hint (${s.hints})</button>`:''}</div>`,'scroll');
    const hint=()=>{ if(hinted||s.hints<=0) return; hinted=true; s.hints--; let rm=0; ui.querySelectorAll('.opt').forEach(b=>{ if(rm<2&&b.dataset.o!==q.a){ b.disabled=true; b.classList.add('dim'); rm++; } }); };
    const answer=(o,t)=>{ const ok=o===q.a; ui.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(b.dataset.o===q.a) b.classList.add('right'); }); if(!ok) t.classList.add('wrong'); ok?Audio_.good():Audio_.bad(); setTimeout(()=>res(ok),ok?550:1200); };
  });
}

function onMyTeamHere(sc){
  // is this place where my team plays?
  const s=S(); if(!s.team) return false; const d=sc.door, M=sc.M;
  if(isSchoolLevel(s.level)) return sc.def.school&&d.data.level===s.level;
  if(s.level==='col') return M.id==='campus'&&M.o.college===s.team&&(d.interior==='venue');
  if(s.level==='pro') return M.id==='pro'&&d.data.venue===sportVenue(s.season?s.season.sport:s.lastSport);
  return false;
}

    case 'pc': { const r=await modal('💻 Computer','',[['Search Gougle',''],['Save game','pri'],['Settings',''],['Close','']]); if(r===0) return openPhone('gougle'); if(r===1) toast(save()?'Game saved':'Could not save'); if(r===2) return settingsMenu(back); return back(); }

    case 'tv': { await modal('📺 SportsNow on TV',s.news.slice(0,6).map(n=>`<p>• ${esc(n.text)}</p>`).join('')||'Nothing on right now.'); return back(); }
    case 'friend': return friendHang(o.fi);
    case 'teacher': {
      const myClass=(isSchoolLevel(s.level)&&sc.def.school&&sc.def.level===s.level&&sc.door.interior==='school')||(s.level==='col'&&sc.door.interior==='lecture'&&sc.M.o.college===s.team);
      if(!myClass) return modal(s.level==='col'?'Professor':'Teacher',`"You're not in my class! Your classes are at ${s.level==='col'?'the Lecture Hall':esc(s.team||'your school')}."`).then(back);

    case 'ad': { if(!isSchoolLevel(s.level)||sc.def.level!==s.level) return modal('Athletic Director','"I only handle sign-ups for our own students."').then(back); return sportsOffice(); }
    case 'coach': case 'venuecoach': return coachMenu(sc);

    case 'trophies': { await modal('🏆 Trophy Case',s.trophies.length?s.trophies.map(t=>`<p>${esc(t)}</p>`).join(''):'<p>Empty… for now. Win a title!</p>'); return back(); }
    case 'shop': return shopMenu();
    case 'music': return openPhone('rhythm');
    case 'gougle': return openPhone('gougle');
    case 'news': return openPhone('sportsnow');
    case 'cafe': { const r=await modal('☕ Café','Smoothie: +2 stats in your next game ($15)',[['Buy smoothie ($15)','pri'],['Just looking','']]); if(r===0){ if(s.money<15) toast('Not enough money'); else { money(-15); s.boost=1; toast('🥤 Boost ready for your next game'); updateHud(); } } return back(); }
    case 'study': {
      if(s.level==='pro') return modal('Library','Pros don\'t have classes — but reading is good for you!').then(back);
      if(s.daily.study) return modal('Library','You already studied today. Come back tomorrow!').then(back);
      const r=await modal('📚 Study','Which class do you want to study for? (+3 to that grade)',[...SUBJECTS.map(x=>[x,'']),['Cancel','']]);

  back();

function gougle(q){

  for(const d of COLLEGE_DIVS){ if(d.short.toLowerCase()===q||d.like.toLowerCase()===q) res.push(`<b>${d.name}</b><br><small>${d.like}-style · 300 colleges · min GPA ${d.gpa}</small>`); for(const c of COLLEGES[d.id]) if(c.toLowerCase().includes(q)&&res.length<40) res.push(`${logoImg(c,28)} <b>${esc(c)}</b> — ${schoolInfo(c).mascot}<br><small>${d.name} · Conf ${findSchool(c).conf+1}</small>`); }
  for(const sp of SPORTS){ if(sp.name.toLowerCase().includes(q)) res.push(`<b>${sp.icon} ${sp.name}</b><br><small>${sportHelp(sp.id)}<br>Pro league: ${PRO[sp.id].name}</small>`); for(const t of PRO[sp.id].teams) if(t.toLowerCase().includes(q)&&res.length<50) res.push(`${logoImg(t,28)} <b>${esc(t)}</b><br><small>${PRO[sp.id].name}</small>`); }
  if(/gpa|grade/.test(q)) res.push('<b>How to raise your GPA</b><br><small>Go to class (0 wrong +3, 1 wrong +1, 2+ wrong −5), study at the library (+3/day), study with friends (+2), use Study Guides. Skipping class costs −4 in every subject.</small>');
  if(/draft|pro/.test(q)) res.push('<b>Going pro</b><br><small>After a college season, declare for the Pro Draft (3★+ usually drafted) or try out at Pro City arenas.</small>');
  if(/tryout|college|offer|recruit/.test(q)) res.push('<b>Getting to college</b><br><small>Play a High School season to get offers (Recruit app), or take the train to any campus and try out at the Athletic Center.</small>');
  if(/release|date/.test(q)) res.push(`<b>${GAME_NAME} release date</b><br><small>${RELEASE.date} (backup: ${RELEASE.backup})</small>`);
  out.innerHTML=res.length?res.map(r=>`<div class="gr">${r}</div>`).join(''):`<p class="sub">No results for "${esc(q)}".</p>`;
}

function worldObjective(M){
  const s=S(); if(!s||!s.team) return null;
  const lv=s.level, se=s.season, tg=todayGame(), needClass=lv!=='pro'&&isSchoolDay(s.day)&&!s.attended;
  const homeId=homeMapId(); const onRight = homeId==='campus'? (M.id==='campus'&&M.o.college===s.team) : M.id===homeId;
  if(!onRight) return {door:'train',text:`Take the train back to ${homeId==='home'?'your hometown':homeId==='campus'?s.team:'Pro City'}`};
  if(isSchoolLevel(lv)){
    if(!se) return {door:lv,text:'Go to your school — the Athletic Director signs you up for a team'};
    if(needClass) return {door:lv,text:isMidtermDay()?'Midterm tests today! Find your teacher':'Get to school — find your teacher for classes'};
    if(tg) return {door:lv,text:`Game today vs ${tg.opp}! Find the coach in the gym`};
  } else if(lv==='col'){
    if(needClass) return {door:'lecture',text:isMidtermDay()?'Midterms today at the Lecture Hall':'Classes at the Lecture Hall'};
    const sp=se?se.sport:s.lastSport;
    if(!se) return {door:campusDoorFor(sp),text:'Talk to your coach to start the season'};
    if(tg) return {door:campusDoorFor(sp),text:`Game today vs ${tg.opp}!`};
  } else {
    const sp=se?se.sport:s.lastSport; const d='v_'+sportVenue(sp);

  }
  if(s.phase==='evening') return {door:homeDoor(),text:'It\'s late — go home and sleep'};
  return {door:homeDoor(),text:'Free time: hang out with friends, study, train, shop — then sleep'};
}
class TitleBG{
  constructor(){ this.t=0; this.kids=[...Array(7)].map((_,i)=>({look:randomLook(i*31+7),x:Math.random()*900,sp:40+Math.random()*50,dir:Math.random()<.5?1:2})); }
  enter(){ setPlaying(false); hud.style.display='none'; }
  update(dt){ this.t+=dt; for(const k of this.kids){ k.x+=(k.dir===2?1:-1)*k.sp*dt; if(k.x>W+40) k.x=-40; if(k.x<-40) k.x=W+40; } }
  draw(c){ c.imageSmoothingEnabled=false; c.fillStyle=pat(c,TEX.turf); c.save(); c.scale(2,2); c.fillRect(0,0,W/2,H/2); c.restore(); c.fillStyle='rgba(255,255,255,.5)'; for(let y=40;y<H;y+=90) c.fillRect(0,y,W,3); c.fillStyle='rgba(10,14,40,.55)'; c.fillRect(0,0,W,H);

  updateRugby(dt){

  judgeSwing(){

  // ---- pitching (top half) ----

// ===== BOWLING =====
class BowlGame extends SportBase{
  constructor(cfg){
    super(cfg);
    this.lw=120; this.laneLen=860; this.nF=({quick:3,standard:5,full:10})[this.len]; this.frame=1; this.roll=1; this.rolls=[]; this.frames=[]; this.oppRolls=[];
    this.look=userLook(cfg);
    this.resetPins(); this.newBall();
    this.cam.x=60; this.cam.y=this.laneLen-120;
  }
  resetPins(){ this.pins=[]; for(let row=0;row<4;row++) for(let i=0;i<=row;i++){ const x=60+(i-row/2)*26, y=110-row*22; this.pins.push({x,y,hx:x,hy:y,vx:0,vy:0,down:false,gone:false}); } }
  newBall(){ this.ball={x:60,y:this.laneLen-40,vx:0,vy:0,gutter:false}; this.phase='aim'; this.aimT=Math.random()*6; this.power=0; this.hook=0; }
  standing(){ return this.pins.filter(p=>!p.down).length; }
  update(dt){
    this.tick(dt); if(this.over) return;
    const b=this.ball;
    setButtons(this.phase==='aim'?'Aim':this.phase==='power'?'Power':'A','');
    if(this.phase==='aim'){ this.aimT+=dt; b.x=60+Math.sin(this.aimT*(2.2-this.assist*.45))*52; this.hint='Tap AIM when the ball lines up with the head pin'; if(Input.a){ this.phase='power'; this.powT=0; } }
    else if(this.phase==='power'){ this.powT+=dt; this.power=(1-Math.cos(this.powT*(3.4-this.assist*.7)))/2; this.hint='Tap POWER near the top of the meter'; if(Input.a){ this.phase='roll'; b.vy=-(330+this.power*430+this.uPow*12); this.hook=(Math.random()-.5)*(30-this.uSkill*2.5); Audio_.tone(90,.4,'sawtooth',.06); } }
    else if(this.phase==='roll'){
      this.rollT=(this.rollT||0)+dt;
      if(!b.gutter){ b.vx+=(Input.mx*(150+this.assist*60)+this.hook)*dt; this.hint='Steer the hook into the pocket!'; }
      for(let k=0;k<6;k++){ const sd=dt/6;
        b.x+=b.vx*sd; b.y+=b.vy*sd;
        if(!b.gutter&&(b.x<-2||b.x>this.lw+2)){ b.gutter=true; b.x=b.x<0?-10:this.lw+10; b.vx=0; this.flash('GUTTER',.8); }
        this.collide(sd,b.gutter); }
      if(b.y<-30||this.rollT>5||(Math.hypot(b.vx,b.vy)<25)){ this.phase='settle'; this.setT=1.3; this.rollT=0; }
    } else if(this.phase==='settle'){ for(let k=0;k<6;k++) this.collide(dt/6,true); this.setT-=dt; if(this.setT<=0) this.score(); }
    
    const z=this.cam.z=clamp(Math.min(W/240,H/520),.8,2.2);
    const ty=this.phase==='roll'||this.phase==='settle'? Math.max(b.y,140) : this.laneLen-140;
    this.follow(60,ty,dt,this.phase==='roll'?8:4);
  }
  collide(dt,pinsOnly){
    const b=this.ball, P=this.pins;
    if(!pinsOnly) for(const p of P){ if(p.gone) continue; const dx=p.x-b.x, dy=p.y-b.y, d=Math.hypot(dx,dy); if(d<17&&d>0){ const nx=dx/d, ny=dy/d; const rel=(b.vx-p.vx)*nx+(b.vy-p.vy)*ny; if(rel>0){ const j=2*rel/(1/6+1); const ra=(Math.random()-.5)*1.1, cs=Math.cos(ra), sn=Math.sin(ra); p.vx+=j*(nx*cs-ny*sn); p.vy+=j*(nx*sn+ny*cs); b.vx-=j*nx/6; b.vy-=j*ny/6; Audio_.noise(.04,.15,0,null,1500); } p.x=b.x+nx*17; p.y=b.y+ny*17; } }
    for(let i=0;i<P.length;i++) for(let j=i+1;j<P.length;j++){ const a=P[i],c=P[j]; if(a.gone||c.gone) continue; const dx=c.x-a.x, dy=c.y-a.y, d=Math.hypot(dx,dy); if(d<16&&d>0){ const nx=dx/d, ny=dy/d, rel=(a.vx-c.vx)*nx+(a.vy-c.vy)*ny; if(rel>0){ a.vx-=rel*nx*.95; a.vy-=rel*ny*.95; c.vx+=rel*nx*.95; c.vy+=rel*ny*.95; } const o=(16-d)/2; a.x-=nx*o; a.y-=ny*o; c.x+=nx*o; c.y+=ny*o; } }
    const fr=Math.exp(-2.2*dt);
    for(const p of P){ if(p.gone) continue; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=fr; p.vy*=fr; if(Math.hypot(p.x-p.hx,p.y-p.hy)>5) p.down=true; if(p.x<-4||p.x>this.lw+4||p.y<-30){ p.down=true; } }
  }
  score(){

    this.rolls.push(fell); const f=this.frame, cur=this.curFrameRolls();
    const left=this.standing();
    if(fell===10){ this.flash('STRIKE!',1.2); Audio_.cheer(); }
    else if(left===0){ this.flash('SPARE!',1.1); Audio_.good(); }
    else this.flash(fell===0?'MISS':fell+' PIN'+(fell>1?'S':''),.9);
    let frameDone=false, fullReset=false;
    if(f<this.nF){ if(cur.length===1&&cur[0]===10) frameDone=true; else if(cur.length>=2) frameDone=true; }
    else {
      if(cur.length===1){ if(cur[0]===10) fullReset=true; }
      else if(cur.length===2){ if(cur[0]===10){ if(cur[1]===10) fullReset=true; } else if(cur[0]+cur[1]===10) fullReset=true; else frameDone=true; }
      else frameDone=true;

    if(frameDone){ this.simOpp(f); if(f===this.nF){ this.phase='done'; this.ms=this.total(this.rolls); this.ts=this.total(this.oppRolls); setTimeout(()=>this.finish(this.ms,this.ts),900); return; } this.frame++; this.resetPins(); }
    else if(fullReset) this.resetPins();

    this.newBall();

// ===== GOLF =====
class GolfGame extends SportBase{
  constructor(cfg){
    super(cfg);

    this.water=[]; if(par!==3||r()<.5){ const k=.3+r()*.3; const p=pts[Math.round(k*n)]; this.water.push({x:p.x+(r()<.5?-1:1)*(r()*120),y:p.y,rx:90+r()*60,ry:34+r()*20}); }
    this.trees=[]; for(let i=0;i<40;i++){ const x=r()*w, y=60+r()*(h-120); if(this.distPath(x,y)<90||Math.hypot(x-pin.x,y-pin.y)<120||Math.hypot(x-tee.x,y-tee.y)<60) continue; this.trees.push({x,y}); }

  distPath(x,y){ let m=1e9; const P=this.path; for(let i=0;i<P.length-1;i++){ const a=P[i],b=P[i+1]; const dx=b.x-a.x, dy=b.y-a.y; const t=clamp(((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy),0,1); m=Math.min(m,Math.hypot(x-(a.x+dx*t),y-(a.y+dy*t))); } return m; }
  lie(x,y){

// ===== RACES: Track & Field (100m), Cross Country (5K), Swimming =====
const DUAL_PTS=[10,8,6,5,4,3,2,1];
class RaceGame extends SportBase{
  constructor(cfg){
    super(cfg);
    this.kind=cfg.sport; const myL=teamLooks(cfg.myColors,hashStr(cfg.us),7,cfg.sport,2), opL=teamLooks(cfg.oppColors,hashStr(cfg.them),7,cfg.sport,1);
    this.ru=[];
    const mk=(team,look,lane,user)=>({team,look,lane,user,s:0,v:0,x:0,y:0,react:.12+Math.random()*.14,vmax:0,stam:1,done:false,time:0,anim:0,surge:false});
    if(this.kind==='xc'){
      for(let i=0;i<7;i++){ this.ru.push(mk(0,i===0?userLook(cfg):myL[i],i,i===0)); this.ru.push(mk(1,opL[i],i+7,false)); }
      this.buildCourse(); this.length=this.course.len;
    } else {
      const lanes=[3,1,5,7,2,4,6,0];
      for(let i=0;i<4;i++) this.ru.push(mk(0,i===0?userLook(cfg):myL[i],lanes[i],i===0));
      for(let i=0;i<4;i++) this.ru.push(mk(1,opL[i],lanes[4+i],false));
      this.laneW=40; this.length= this.kind==='track'? 1000 : (this.len==='full'?4:2)*250;
      this.pool=this.kind==='swimming'; this.lengths=this.pool?this.length/250:1;
    }
    this.user=this.ru[0];
    const base=this.kind==='swimming'?44:this.kind==='xc'?62:72;
    for(const r of this.ru){ const sk=r.user?this.uSpd:r.team===0?4.5+this.assist*.3:this.oSkill*.75+.8; r.vmax=base+sk*(this.kind==='swimming'?2.4:3.4)+(Math.random()-.5)*4; }
    this.state='marks'; this.stateT=1.1; this.goT=0; this.tapLast=null; this.cad=0; this.falses=0; this.raceT=0;
    this.cam.z=1; this.places=[];
  }
  buildCourse(){

    super(cfg);

    this.ei=0; this.scores=[]; this.oppTotal=0; this.myTotal=0; this.diff=1; this.look=userLook(cfg); this.look.helmet=undefined;
    this.cam.x=0; this.cam.y=0; this.startEvent();
  }
  startEvent(){ this.state='pick'; this.notes=[]; this.ded=0; this.spin=0; this.flash(this.events[this.ei][0].toUpperCase(),1.2,`Event ${this.ei+1} of ${this.events.length}`); }
  begin2(){ const [name,n]=this.events[this.ei]; const cnt=n+(this.len==='full'?3:0)+this.diff*2; const gap=(1.05-this.diff*.15)+(this.assist*.12);
    this.notes=[]; for(let i=0;i<cnt;i++) this.notes.push({t:1.2+i*gap*(.8+Math.random()*.4),hit:null}); this.et=0; this.state='perform'; this.dScore=[3.6,4.6,5.6][this.diff]+(name==='Vault'?.4:0); }
  update(dt){
    this.tick(dt); if(this.over) return;
    if(this.state==='pick'){ setButtons('Start','Difficulty'); this.hint=`Difficulty: ${['Safe (D 3.6)','Standard (D 4.6)','Hard (D 5.6)'][this.diff]} — B to change, A to start`; if(Input.b){ this.diff=(this.diff+1)%3; Audio_.blip(); } if(Input.a&&this.msgT<=.6) this.begin2(); return; }
    if(this.state==='score'){ this.stateT-=dt; if(this.stateT<=0){ this.ei++; if(this.ei>=this.events.length){ const my=Math.round(this.myTotal*100)/100, op=Math.round(this.oppTotal*100)/100; this.ms=my; this.ts=op; return this.finish(my,op); } this.startEvent(); } return; }
    this.et+=dt; setButtons('Tap',''); this.hint='Tap when the ring closes on the target';
    const win=.13+this.assist*.05+this.uSkill*.006-this.diff*.02;
    const next=this.notes.find(n=>n.hit===null);
    if(Input.a&&next){ const d=Math.abs(this.et-next.t); if(d<win*2.2){ const q=d<win*.4?'PERFECT':d<win?'GOOD':'OK'; next.hit=q; this.ded+=q==='PERFECT'?0:q==='GOOD'?.1:.3; this.spin+=1; Audio_.tone(q==='PERFECT'?880:660,.06,'square',.06); this.judge=q; this.judgeT=.4; } }
    for(const n of this.notes) if(n.hit===null&&this.et>n.t+win*2.2){ n.hit='MISS'; const fall=(this.events[this.ei][0]==='Beam'||this.events[this.ei][0]==='Bars')&&Math.random()<.4; this.ded+=fall?1.0:.5; this.judge=fall?'FALL':'MISS'; this.judgeT=.6; Audio_.bad(); }
    if(this.judgeT>0) this.judgeT-=dt;
    if(this.notes.every(n=>n.hit!==null)&&this.et>this.notes[this.notes.length-1].t+.6){
      const E=Math.max(5,10-this.ded-.2), score=Math.round((this.dScore+E)*1000)/1000; this.myTotal+=score*3*(1+this.assist*.0)+0; // you + 2 teammates (mirror your form)
      const tm=[0,1].map(()=>clamp(score+(Math.random()-.5)*.8-.2,8,16)); this.myTotal+=tm[0]+tm[1]-score*2;
      const opp=[0,1,2].map(()=>clamp(10.5+this.oSkill*.42+(Math.random()-.5)*1.2-this.assist*.25,8,16)).reduce((a,b)=>a+b,0); this.oppTotal+=opp;
      this.flash(score.toFixed(3),2,`D ${this.dScore.toFixed(1)} + E ${E.toFixed(3)}`); Audio_.cheer(); this.state='score'; this.stateT=2.2; this.ms=Math.round(this.myTotal*100)/100; this.ts=Math.round(this.oppTotal*100)/100; }
  }
  draw(c){
    c.fillStyle='#283046'; c.fillRect(0,0,W,H);
    this.cam.z=clamp(Math.min(W,H)/340,1,2.2);
    this.begin(c);
    const ev=this.events[this.ei]?this.events[this.ei][0]:'Floor';
    c.fillStyle='#1e88e5'; if(ev==='Floor'){ c.fillRect(-150,-150,300,300); c.strokeStyle='#fff'; c.lineWidth=3; c.strokeRect(-140,-140,280,280); }
    if(ev==='Beam'){ c.fillStyle='#5d4037'; c.fillRect(-160,-6,320,12); c.fillStyle='#d7ccc8'; c.fillRect(-160,-6,320,4); }
    if(ev==='Bars'){ c.fillStyle='#bdbdbd'; c.fillRect(-120,-40,240,4); c.fillRect(-120,30,240,4); c.fillStyle='#616161'; c.fillRect(-124,-50,6,90); c.fillRect(118,-50,6,90); }
    if(ev==='Vault'){ c.fillStyle='#795548'; c.fillRect(-200,-8,300,16); c.fillStyle='#1565c0'; c.fillRect(110,-24,40,48); }
    c.drawImage(logoCanvas(this.cfg.us,64),-30,-140,60,60);
    const prog=this.state==='perform'?clamp(this.et/((this.notes[this.notes.length-1]||{t:1}).t+.6),0,1):0;
    const px= ev==='Floor'? Math.cos(prog*Math.PI*4)*90 : -140+prog*260, py=ev==='Floor'?Math.sin(prog*Math.PI*4)*90:(ev==='Bars'?-38:-4);
    c.save(); c.translate(px,py); c.rotate(this.judgeT>0&&this.judge!=='MISS'&&this.judge!=='FALL'?(1-this.judgeT/.4)*Math.PI*2:0); drawChar(c,this.look,0,20,ev==='Floor'?0:2,0,1.8); c.restore();
    this.end(c);
    if(this.state==='perform'){ const cx=W/2, cy=H*.68, win=.13+this.assist*.05+this.uSkill*.006-this.diff*.02;
      c.strokeStyle='#fff'; c.lineWidth=4; c.beginPath(); c.arc(cx,cy,22,0,7); c.stroke();
      for(const n of this.notes){ if(n.hit!==null) continue; const dtn=n.t-this.et; if(dtn>1.4||dtn<-win*2.2) continue; const r=22+dtn*90; if(r<4) continue; c.strokeStyle=Math.abs(dtn)<win?'#2fbf62':'#ffd23f'; c.lineWidth=3; c.beginPath(); c.arc(cx,cy,r,0,7); c.stroke(); }
      if(this.judgeT>0){ c.font='bold 20px "Russo One",sans-serif'; c.textAlign='center'; c.fillStyle=this.judge==='PERFECT'?'#2fbf62':this.judge==='GOOD'?'#ffd23f':'#ff4d4d'; c.fillText(this.judge,cx,cy-40); } }
    this.scoreboard(c,`Gymnastics · ${ev}`,`Team ${this.ms.toFixed?this.ms.toFixed(2):this.ms} — ${this.ts.toFixed?this.ts.toFixed(2):this.ts}`);
  }
}

const SEASONS=['Fall','Winter','Spring','Summer'];
function seasonOf(day){ return SEASONS[Math.floor((day-1)/28)%4]; }
function weatherOf(day){ const r=seeded(day*7919)(); const se=seasonOf(day); if(se==='Winter') return r<.35?'snow':r<.55?'cloudy':'clear'; if(se==='Summer') return r<.12?'rain':'clear'; return r<.3?'rain':r<.5?'cloudy':'clear'; }
const WEATHER_ICON={clear:'☀️ Clear',cloudy:'☁️ Cloudy',rain:'🌧️ Rain',snow:'❄️ Snow'};
const PARTICLES=[...Array(140)].map(()=>({x:Math.random(),y:Math.random(),s:.5+Math.random()}));
function drawWeather(c){
  const s=S(); if(!s) return; const se=seasonOf(s.day), w=weatherOf(s.day), t=Game.t;
  if(se==='Fall'){ c.fillStyle='rgba(255,140,40,.07)'; c.fillRect(0,0,W,H); } if(se==='Winter'){ c.fillStyle='rgba(200,225,255,.13)'; c.fillRect(0,0,W,H); } if(se==='Spring'){ c.fillStyle='rgba(120,255,160,.05)'; c.fillRect(0,0,W,H); }
  if(w==='cloudy'){ c.fillStyle='rgba(60,70,90,.12)'; c.fillRect(0,0,W,H); }
  if(w==='rain'){ c.fillStyle='rgba(40,60,90,.15)'; c.fillRect(0,0,W,H); c.strokeStyle='rgba(180,200,255,.5)'; c.lineWidth=1; c.beginPath(); for(const p of PARTICLES){ const x=(p.x*W+t*60*p.s)%W, y=(p.y*H+t*520*p.s)%H; c.moveTo(x,y); c.lineTo(x-3,y+12); } c.stroke(); }
  if(w==='snow'){ c.fillStyle='rgba(255,255,255,.85)'; for(const p of PARTICLES){ const x=(p.x*W+Math.sin(t+p.y*9)*20+W)%W, y=(p.y*H+t*50*p.s)%H; c.fillRect(x,y,2+p.s,2+p.s); } }
}

function clockStr(){ const s=S(); const base={morning:7*60+20,afternoon:15*60+10,evening:19*60+30}[s.phase]||600; const m=base+Math.min(170,Math.floor((Game.t%600)/3)); const h=Math.floor(m/60)%24, mm=m%60; return `${(h+11)%12+1}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`; }

const GOLD_CACHE={};
function goldFor(M){ const key=M.id==='campus'?'campus':M.id; if(GOLD_CACHE[key]) return GOLD_CACHE[key]; const n=key==='home'?15:key==='campus'?8:10; const r=seeded(hashStr('gold'+key)); const out=[]; let g=0;
  const probe={hits:(x,y)=>{ for(const s of M.solids) if(x+12>s.x&&x-12<s.x+s.w&&y>s.y-4&&y-12<s.y+s.h) return true; return false; }};
  while(out.length<n&&g++<4000){ const x=60+r()*(M.w-120), y=60+r()*(M.h-120); if(probe.hits(x,y)) continue; if(out.some(o=>Math.hypot(o.x-x,o.y-y)<200)) continue; out.push({x,y,id:key+out.length}); }
  return GOLD_CACHE[key]=out; }

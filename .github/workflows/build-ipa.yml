# Builds an unsigned GameStore.ipa on a GitHub-hosted Mac.
# No Mac and no paid Apple account needed: Sideloadly / AltStore sign it with your
# free Apple ID when you install it.
#
# Runs on every push to main, or manually from the Actions tab ("Run workflow").
# Download the result from the run page under "Artifacts".

name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore: ["Resources/games.json", "docs/**", "**.md"]   # game list + hosted games don't need an app rebuild
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project GameStore.xcodeproj \
            -scheme GameStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GameStore.app Payload/
          zip -qry GameStore.ipa Payload
          ls -lh GameStore.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GameStore-ipa
          path: GameStore.ipa
          retention-days: 30

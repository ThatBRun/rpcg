# Builds an unsigned NOVA.ipa (the NOVA voice assistant app) on a GitHub-hosted Mac.
# Install it with Sideloadly, the same way as RamPace.
# Runs when anything in NOVA/ changes, or manually from the Actions tab ("Run workflow").

name: Build NOVA

on:
  push:
    branches: [main]
    paths: ["NOVA/**", "project.yml", ".github/workflows/build-nova.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project GameStore.xcodeproj \
            -scheme NOVA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NOVA.app Payload/
          zip -qry NOVA.ipa Payload
          ls -lh NOVA.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-ipa
          path: NOVA.ipa
          retention-days: 30
